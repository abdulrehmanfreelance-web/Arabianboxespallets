function bindQuoteCompanyAC(){
  var inp=document.getElementById('q_company');var panel=document.getElementById('qCompanyAC');if(!inp||!panel)return;
  var profs={};state.clients.slice().reverse().forEach(function(c){if(c.company)profs[c.company.toLowerCase()]=c;});
  var prev=qPrevClients();
  function show(){var qv=inp.value.trim().toLowerCase();if(!qv){panel.classList.remove('open');return;}
    var a=Object.keys(profs).map(function(k){return profs[k];}).filter(function(c){return c.company.toLowerCase().indexOf(qv)>=0;}).slice(0,5).map(function(c){return '<div class="ac-opt" data-qcpick="'+c.id+'"><b>'+esc(c.company)+'</b> <span class="tag">Inquiry</span>'+(([c.location,c.phone].filter(Boolean).join(' · '))?'<div style="font-size:11px;color:var(--muted);margin-top:2px;">'+esc([c.location,c.phone].filter(Boolean).join(' · '))+'</div>':'')+'</div>';});
    var b=[];prev.forEach(function(p,i){if((p.company||'').toLowerCase().indexOf(qv)>=0&&!profs[(p.company||'').toLowerCase()]&&b.length<5)b.push('<div class="ac-opt" data-qppick="'+i+'"><b>'+esc(p.company)+'</b> <span class="tag">Earlier quotation</span></div>');});
    var html=a.concat(b).join('');if(!html){panel.classList.remove('open');return;}panel.innerHTML=html;panel.classList.add('open');}
  inp.addEventListener('input',show);inp.addEventListener('focus',show);
  panel.addEventListener('click',function(e){var o=e.target.closest('[data-qcpick]');if(o){panel.classList.remove('open');qPickClient(o.getAttribute('data-qcpick'));return;}o=e.target.closest('[data-qppick]');if(o){panel.classList.remove('open');qPickPrev(+o.getAttribute('data-qppick'));}});
}
function openQuote(id){ if(!can('quotesEdit')){toast('You do not have permission to create or edit quotations.');return;}
  state.modalOpen=true;state.qStep=1;
  if(id){var q=state.quotes.find(function(x){return x.id===id;});state.editingQuote=JSON.parse(JSON.stringify(q));if(!state.editingQuote.client)state.editingQuote.client={company:'',attention:'',address:'',tel:'',email:'',vat:''};}
  else state.editingQuote=newQuote();
  renderQuote();
}
function reviseQuote(id){
  var q=state.quotes.find(function(x){return x.id===id;});if(!q)return;
  var copy=JSON.parse(JSON.stringify(q));copy.id=uid();copy.rev=(q.rev||0)+1;copy.status='Draft';copy.createdTs=Date.now();copy.parentId=q.id;copy.date=today();copy.validUntil=addDays(today(),QUOTE_VALID_DAYS);
  state.modalOpen=true;state.qStep=2;state.editingQuote=copy;renderQuote();
}
function saveQuote(mode){
  readQuoteForm();var q=state.editingQuote;if(!q)return;
  if(!q.client.company||!q.client.company.trim()){state.qStep=1;renderQuote();toast('Please enter the customer company first.');var ce=document.getElementById('q_company');if(ce){ce.focus();ce.style.borderColor='#B93A2E';}return;}
  q.items=q.items.filter(qHasItem);
  if(!q.items.length){q.items=[qEmptyRow()];renderQuote();toast('Add at least one product before saving.');var pe=document.querySelector('[data-qi] [data-qf="product"]');if(pe)pe.focus();return;}
  if(q.items.some(function(i){return !(parseFloat(i.price)>0);})&&!confirm('Some lines have no price. Save anyway?'))return;
  delete q._pool;
  var existing=state.quotes.find(function(x){return x.id===q.id;});
  q.updatedTs=Date.now();q.by=state.me||OWNER||'Team';
  if(existing){q.rev=(existing.status&&existing.status!=='Draft')?(existing.rev||0)+1:(existing.rev||0);state.quotes=state.quotes.map(function(x){return x.id===q.id?q:x;});pushActivity('Revised quotation',q.client.company,q.number+' Rev '+q.rev,q.clientId||null,null);}
  else{state.quotes=state.quotes.concat([q]);pushActivity(q.rev?'Revised quotation':'Created quotation',q.client.company,q.number+(q.rev?' Rev '+q.rev:''),q.clientId||null,null);}
  if(q.clientId){var c=state.clients.find(function(x){return x.id===q.clientId;});if(c&&c.quoteShared!=='Yes'){if(confirm('Mark this client’s inquiry as "Quotation submitted"?')){c.quoteShared='Yes';c.quoteValue=money(qGrand(q));state.clients=state.clients.map(function(x){return x.id===c.id?c:x;});pushActivity('Quotation submitted',c.company,'',c.id,null);}}}
  state.editingQuote=null;closeModal();render();apiSaveAll();toast('Quotation '+q.number+' saved ✓');
  if(mode==='pdf')downloadQuotePDF(q.id);
}
/* ---- wizard events ---- */

document.addEventListener('change',function(e){var t=e.target;if(!state.editingQuote||!t||!t.matches)return;

async function downloadQuotePDF(id){ if(!can('quotesPdf')){toast('You do not have permission to download quotations.');return;} var q=state.quotes.find(function(x){return x.id===id;});if(!q)return;var w=window.open('','_blank');if(!w){alert('Please allow pop-ups to download the PDF.');return;}w.document.write(await renderDoc(quoteHTML,q));w.document.close();setTimeout(function(){w.focus();w.print();},450);}
function clientQuote(cid){var qs=(state.quotes||[]).filter(function(q){return q.clientId===cid;});return qs.length?qs.slice().sort(function(a,b){return (b.createdTs||0)-(a.createdTs||0);})[0]:null;}
async function viewQuotePDF(id){ if(!can('quotesList')&&!can('quotations')&&!can('quotesPdf')){toast('You do not have access to quotations.');return;} var q=state.quotes.find(function(x){return x.id===id;});if(!q)return;var w=window.open('','_blank');if(!w){alert('Please allow pop-ups to view the quotation.');return;}w.document.write(await renderDoc(quoteHTML,q));w.document.close();try{w.focus();}catch(e){}}
function viewClientQuote(cid){var q=clientQuote(cid);if(q){viewQuotePDF(q.id);}else{toast('No saved quotation for this client yet.');}}

function viewQuotes(){

  var list=(state.quotes||[]).filter(function(q){

    +'<td style="padding:12px;font-size:13px;">'+esc((q.client&&q.client.company)||'—')+(q.inqRef?'<div style="font-size:11px;color:var(--muted);">Inquiry ref: #'+esc(q.inqRef)+'</div>':'')+'</td>'
    +'<td style="padding:12px;font-size:12.5px;color:var(--ink2);white-space:nowrap;">'+human(q.date)+'</td>'
    +'<td style="padding:12px;font-size:12.5px;color:var(--ink2);">'+(q.items||[]).length+' item'+((q.items||[]).length===1?'':'s')+'</td>'

function qReportQuotes(){var f=state.qFilter;return (state.quotes||[]).filter(function(q){if(f.from&&(q.date||'')<f.from)return false;if(f.to&&(q.date||'')>f.to)return false;if(f.product!=='All'&&!(q.items||[]).some(function(it){return it.product===f.product;}))return false;return true;});}
function qReportAgg(){
  var f=state.qFilter;var quotes=qReportQuotes();var r={n:quotes.length,val:0,sub:0,vat:0,disc:0,byProd:{},byClient:{},byMonth:{}};
  quotes.forEach(function(q){r.val+=qGrand(q);r.sub+=qSub(q);r.vat+=qVatAmt(q);r.disc+=qDisc(q);
    (q.items||[]).forEach(function(it){if(f.product!=='All'&&it.product!==f.product)return;var p=it.product||'—';r.byProd[p]=r.byProd[p]||{qty:0,amt:0};r.byProd[p].qty+=(parseFloat(it.qty)||0);r.byProd[p].amt+=qAmt(it);});
    var cl=(q.client&&q.client.company)||'—';r.byClient[cl]=(r.byClient[cl]||0)+qGrand(q);
    var mo=(q.date||'').slice(0,7);if(mo)r.byMonth[mo]=(r.byMonth[mo]||0)+qGrand(q);
  });return r;
}
function qBars(title,obj,valFmt){var keys=Object.keys(obj);var vals=keys.map(function(k){return typeof obj[k]==='object'?obj[k].amt:obj[k];});var max=Math.max(1,Math.max.apply(null,vals.length?vals:[1]));var tot=vals.reduce(function(s,v){return s+v;},0);
  var rows=keys.sort(function(a,b){var va=typeof obj[a]==='object'?obj[a].amt:obj[a];var vb=typeof obj[b]==='object'?obj[b].amt:obj[b];return vb-va;}).slice(0,12).map(function(k,idx){var v=typeof obj[k]==='object'?obj[k].amt:obj[k];var c=colr(idx);var extra=typeof obj[k]==='object'?(' · '+obj[k].qty+' units'):'';return '<div style="display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:center;margin-bottom:12px;"><div style="min-width:0;"><div style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span style="width:9px;height:9px;border-radius:3px;background:'+c+';flex-shrink:0;"></span>'+esc(k)+'<span style="color:var(--muted);">'+extra+'</span></div><div style="height:7px;background:var(--lineSoft);border-radius:6px;overflow:hidden;"><i style="display:block;height:100%;width:'+Math.round(v/max*100)+'%;background:'+c+';border-radius:6px;"></i></div></div><div style="text-align:right;font-size:12.5px;font-weight:700;white-space:nowrap;">'+valFmt(v)+'</div></div>';}).join('')||'<div style="color:var(--muted);font-size:13px;">No data.</div>';
  return '<div class="card" style="padding:18px 18px 8px;flex:1;min-width:280px;"><div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;"><span style="width:5px;height:15px;border-radius:3px;background:var(--accent);display:inline-block;"></span>'+title+'</div>'+rows+'</div>';
}

  var table='<div class="tablewrap card" style="overflow:hidden;"><div style="padding:14px 16px;font-weight:700;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--lineSoft);">Quotations in this range</div><table><thead><tr style="background:#F8F9FB;"><th style="padding-left:12px;">Quote no.</th><th>Client</th><th>Date</th><th>Items</th><th>Grand total</th></tr></thead><tbody>'+trows+'</tbody></table></div>';

}

/* migrate an old-model prospect to the new one */
function migrateProspect(p){
  if(!p)return newProspect();
  if(p._m&&Array.isArray(p.activities))return p;
  var map={'New':'New','Attempted':'No answer','Wrong person':'No answer','Reached right person':'Follow up','Interested':'Interested','Good opportunity':'Interested','Quotation requested':'Requirement shared','Requirement shared (past)':'Requirement shared','Requirement shared':'Requirement shared','Not much needed':'Not interested','No need for product':'Not interested','Converted':'Won','Not interested':'Not interested','Do not contact':'Dead','No answer':'No answer','Follow up':'Follow up','Quotation sent':'Quotation sent','Won':'Won','Dead':'Dead'};
  var np={id:p.id||uid(),company:p.company||'',contact:p.rpName||p.contact||'',phone:p.rpPhone||p.phone||p.phone2||'',region:p.region||p.city||'',status:map[p.status]||'New',followUpDate:'',followUpTime:'',lastActivityDate:'',activities:[],crmClientId:p.crmClientId||p.convertedClientId||'',_m:true};
  if(Array.isArray(p.activities)&&p.activities.length&&p.activities[0].outcome!==undefined){ np.activities=p.activities.map(function(a){return {id:a.id||uid(),date:a.date||tsIso(a.ts||Date.now()),channel:a.channel||a.ch||'Call',outcome:map[a.outcome||a.status]||a.outcome||a.status||'',note:a.note||a.remark||'',prevStatus:a.prevStatus||'',newStatus:a.newStatus||map[a.status]||''};}); }
  else if(Array.isArray(p.touches)){ np.activities=p.touches.map(function(t){return {id:uid(),date:tsIso(t.ts),channel:t.ch||'Call',outcome:map[t.status]||t.status||'',note:t.remark||'',prevStatus:'',newStatus:map[t.status]||''};}); }
  if(np.activities.length)np.lastActivityDate=np.activities[np.activities.length-1].date;
  if(np.status==='Follow up')np.followUpDate=guardFri(p.followUpDate||p.nextDate||nextWorkday(today()));
  return np;
}
function migrateAllProspects(){state.prospects=toArr(state.prospects).map(migrateProspect);}
function toArr(x){if(!x)return [];if(Array.isArray(x))return x.filter(function(v){return v!=null;});if(typeof x==='object')return Object.keys(x).map(function(k){return x[k];}).filter(function(v){return v!=null;});return [];}
function mergeKeep(inc,cur){inc=toArr(inc);return (inc.length===0&&toArr(cur).length>0)?toArr(cur):inc;}
function mergeClients(incoming,local){
  incoming=toArr(incoming); local=toArr(local);
  if(!local.length)return incoming;
  var byId={}; local.forEach(function(c){if(c&&c.id)byId[c.id]=c;});
  return incoming.map(function(inc){
    if(!inc||!inc.id)return inc;
    var loc=byId[inc.id];
    if(!loc||!loc.followups)return inc;
    var f=Object.assign({},inc.followups||{});
    var changed=false;
    Object.keys(loc.followups).forEach(function(k){
      var lr=loc.followups[k], ir=f[k];
      if(lr&&lr.done&&(!ir||!ir.done)){ f[k]=Object.assign({},ir||{},lr); changed=true; }
    });
    return changed?Object.assign({},inc,{followups:f}):inc;
  });
}

function donutSVG(data){var keys=Object.keys(data).filter(function(k){return data[k]>0;});var total=keys.reduce(function(s,k){return s+data[k];},0);if(!total)return '<div style="color:var(--muted);font-size:13px;padding:16px;">No data yet.</div>';var r=52,cx=70,cy=70,circ=2*Math.PI*r,off=0;var segs=keys.map(function(k,i){var frac=data[k]/total;var s='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colr(i)+'" stroke-width="20" stroke-dasharray="'+(frac*circ).toFixed(2)+' '+(circ-frac*circ).toFixed(2)+'" stroke-dashoffset="'+(-off*circ).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';off+=frac;return s;}).join('');var legend=keys.map(function(k,i){return '<div style="display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:6px;"><span style="width:10px;height:10px;border-radius:3px;background:'+colr(i)+';flex-shrink:0;"></span><span style="flex:1;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(k)+'</span><b>'+data[k]+'</b></div>';}).join('');return '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;"><svg viewBox="0 0 140 140" width="132" height="132">'+segs+'<text x="70" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="#2A2E37">'+total+'</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="#8A93A2">total</text></svg><div style="flex:1;min-width:150px;">'+legend+'</div></div>';}

function parseDelimited(text){text=text.replace(/\r/g,'');var lines=text.split('\n').filter(function(l){return l.trim()!=='';});if(!lines.length)return null;var delim=lines[0].indexOf('\t')>=0?'\t':',';function sp(l){if(delim==='\t')return l.split('\t');var out=[],cur='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===','&&!q){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out;}var headers=sp(lines[0]).map(function(h){return h.trim();});var rows=lines.slice(1).map(function(l){var c=sp(l);var o={};headers.forEach(function(h,i){o[h]=(c[i]||'').trim();});return o;});return {headers:headers,rows:rows};}

/* ============================================================ SALES FORECAST ============================================================ */
function ymNow(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymShift(ym,delta){var p=(ym||ymNow()).split('-');var d=new Date(parseInt(p[0],10),parseInt(p[1],10)-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymLabel(ym){if(!ym)return '';var p=ym.split('-');var mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return mn[parseInt(p[1],10)-1]+' '+p[0];}
function weeksInMonth(ym){var p=(ym||ymNow()).split('-');var days=new Date(parseInt(p[0],10),parseInt(p[1],10),0).getDate();return Math.min(5,Math.ceil(days/7));}
function saleMonthList(){ var s={};salesEntries().forEach(function(e){if(e.month)s[e.month]=1;});s[ymNow()]=1;return Object.keys(s).sort().reverse();}
function newSale(){return {id:uid(),clientId:'',company:'',month:(state.salesF&&state.salesF.month)||ymNow(),product:'',target:0,weeks:[0,0,0,0,0],note:'',createdTs:Date.now(),by:(state.me||OWNER||'Team')};}
function saleFind(id){return (state.sales||[]).find(function(x){return x.id===id;});}
function saleActual(e){return (e.weeks||[]).reduce(function(s,w){return s+(Number(w)||0);},0);}
function derivedWonEntries(){var out=[];(state.clients||[]).forEach(function(c){if(c.status!=='Won')return;var val=parseAmt(c.wonValue);if(!val)val=clientQuoteValue(c);var ym=(c.wonDate||c.inquiryDate||today()).slice(0,7);var wi=weekOfMonth(c.wonDate||c.inquiryDate||today());var weeks=[0,0,0,0,0];weeks[wi]=val;out.push({id:'won_'+c.id,wonRef:'won:'+c.id,clientId:c.id,company:c.company||'',month:ym,product:(c.products&&c.products[0])||'',target:0,weeks:weeks,note:'Won (from CRM)',derived:true});});return out;}
function salesEntries(){var stored=(state.sales||[]).filter(function(e){return !e.wonRef;});return stored.concat(derivedWonEntries());}
function salesFilter(month,product){return salesEntries().filter(function(e){if(month&&e.month!==month)return false;if(product&&product!=='All'&&(e.product||'')!==product)return false;return true;});}
function companyMonth(company,month,product){var es=salesFilter(month,product).filter(function(e){return (e.company||'').toLowerCase()===(company||'').toLowerCase();});var t=0,a=0;es.forEach(function(e){t+=Number(e.target)||0;a+=saleActual(e);});return {target:t,actual:a,entries:es};}

function openSale(id){ if(!can('salesEdit')){toast('You do not have permission to edit the sales forecast.');return;} state.modalOpen=true; if(id){state.editingSale=JSON.parse(JSON.stringify(saleFind(id)));}else{state.editingSale=newSale();} if(!state.editingSale.weeks)state.editingSale.weeks=[0,0,0,0,0]; renderSale(); }
function readSaleForm(){var e=state.editingSale;if(!e)return;var g=function(id){var x=document.getElementById(id);return x?x.value:'';};
  e.company=g('sf_company');e.month=g('sf_month')||e.month;var pr=document.getElementById('sf_product');e.product=pr?pr.value:e.product;e.target=Number(g('sf_target'))||0;e.note=g('sf_note');
  var wc=weeksInMonth(e.month);e.weeks=e.weeks||[];for(var i=0;i<5;i++){e.weeks[i]=(i<wc)?(Number(g('sf_w'+i))||0):0;}
}
function salePickClient(cid){readSaleForm();var c=state.clients.find(function(x){return x.id===cid;});if(c){var e=state.editingSale;e.clientId=c.id;e.company=c.company||'';}renderSale();}
function renderSale(){
  var e=state.editingSale;var ex=saleFind(e.id);var wc=weeksInMonth(e.month);var wf=e.target?(Number(e.target)/wc):0;var act=saleActual(e);
  var prodOpts='<option value="">All / not specified</option>'+PRODUCTS.map(function(p){return '<option'+(e.product===p?' selected':'')+'>'+esc(p)+'</option>';}).join('');
  var monOpts=[];for(var k=-6;k<=6;k++){var ym=ymShift(ymNow(),k);monOpts.push('<option value="'+ym+'"'+(e.month===ym?' selected':'')+'>'+ymLabel(ym)+'</option>');}
  var weekRows='';for(var i=0;i<wc;i++){weekRows+='<div><label class="field-label">Week '+(i+1)+' actual</label><input type="number" min="0" step="any" id="sf_w'+i+'" value="'+esc((e.weeks&&e.weeks[i])||0)+'"/></div>';}
  var body='<div style="padding:18px 20px;max-height:72vh;overflow:auto;">'
    +'<div class="ac"><label class="field-label">Client company <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;">— type to pull a saved client</span></label><input id="sf_company" autocomplete="off" value="'+esc(e.company||'')+'" placeholder="Company name"/><div class="ac-panel" id="sfCompanyAC"></div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">'
    +'<div><label class="field-label">Month</label><select id="sf_month" class="fancy">'+monOpts.join('')+'</select></div>'
    +'<div><label class="field-label">Product <span style="color:var(--muted);font-weight:400;">(optional)</span></label><select id="sf_product" class="fancy">'+prodOpts+'</select></div>'
    +'</div>'
    +'<div style="margin-top:12px;"><label class="field-label">Monthly target (SAR)</label><input type="number" min="0" step="any" id="sf_target" value="'+esc(e.target||0)+'"/></div>'
    +'<div style="background:#F8F9FB;border:1px solid var(--lineSoft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12px;color:var(--ink2);">Weekly forecast ('+wc+' weeks): <b>'+money(wf)+'</b> per week &nbsp;·&nbsp; Actual so far: <b>'+money(act)+'</b>'+(e.target?' &nbsp;·&nbsp; '+Math.round(act/e.target*100)+'% of target':'')+'</div>'
    +'<div style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;">Actual sales by week</div>'
    +'<div style="display:grid;grid-template-columns:repeat('+wc+',1fr);gap:10px;">'+weekRows+'</div>'

function deltaBadge(cur,prev){
  if(prev<=0){ if(cur>0)return '<span style="color:var(--done);font-weight:700;">New</span>'; return '<span style="color:var(--muted);">—</span>'; }
  var d=cur-prev;var pctv=Math.round(d/prev*100);var up=d>=0;var col=up?'var(--done)':'var(--overdue)';var arrow=up?'▲':'▼';
  return '<span style="color:'+col+';font-weight:700;">'+arrow+' '+Math.abs(pctv)+'%</span>';
}

function viewSalesReport(){
  state.salesF=state.salesF||{month:'',product:'All',search:''};if(!state.salesF.month)state.salesF.month=ymNow();

function doImportDN(data){
  var comps=data.companies||{};var hist=data.history||{};
  var idMap={};var addedC=0,addedD=0,skipped=0;
  state.dnCompanies=state.dnCompanies||[];state.dns=state.dns||[];
  var haveNums={};(state.dns||[]).forEach(function(d){haveNums[String(d.dnNum)]=1;});
  Object.keys(comps).forEach(function(oldId){var c=comps[oldId];var existing=dnCompByName(c.name);var nc;
    if(existing){nc=existing;nc.city=nc.city||c.city||'';nc.contact=nc.contact||c.contact||'';nc.phone=nc.phone||c.phone||'';if((c.nextDN||0)>(nc.nextDN||0))nc.nextDN=c.nextDN;}
    else{nc=newDnCompany();nc.name=(c.name||'').trim();nc.city=c.city||'';nc.contact=c.contact||'';nc.phone=c.phone||'';nc.nextDN=c.nextDN||1;nc.notes=c.notes||'';state.dnCompanies.push(nc);addedC++;}
    idMap[oldId]=nc.id;
  });
  Object.keys(hist).forEach(function(k){var r=hist[k];if(r.dnNum==null){skipped++;return;}if(haveNums[String(r.dnNum)]){skipped++;return;}
    var compId=idMap[r.companyId]||'';if(!compId){var byName=dnCompByName(r.companyName);if(byName)compId=byName.id;else{var nc2=newDnCompany();nc2.name=(r.companyName||'Unknown').trim();nc2.city=r.city||'';nc2.contact=r.attention||'';nc2.phone=r.telephone||'';nc2.nextDN=(parseInt(String(r.dnNum),10)||1)+1;state.dnCompanies.push(nc2);addedC++;compId=nc2.id;}}
    var items=Array.isArray(r.items)?r.items.map(function(it){return {sr:it.sr||'',qty:it.qty||'',unit:it.unit||'',desc:it.desc||''};}):[];
    state.dns.push({id:uid(),dnNum:r.dnNum,date:r.date||'',companyId:compId,companyName:r.companyName||'',city:r.city||'',attention:r.attention||'',telephone:r.telephone||'',po:r.po||'',remarks:r.remarks||'',items:items,stamp:false,inqRef:'',quoteRef:'',signed:false,signedDate:'',invoiced:false,invoiceNo:'',invoicedDate:'',createdAt:r.createdAt||new Date().toISOString(),by:OWNER});
    haveNums[String(r.dnNum)]=1;addedD++;
  });
  pushActivity('Imported delivery notes','',addedD+' DNs · '+addedC+' companies',null,null);
  apiSaveAll();
  var st=document.getElementById('dnimp_status');if(st)st.innerHTML='<span style="color:var(--done);font-weight:600;">Imported '+addedD+' delivery notes and '+addedC+' companies.</span>'+(skipped?' <span style="color:var(--muted);">'+skipped+' skipped (already present or no number).</span>':'');
  render();
}

var DN_SIGN_DUE=1;      /* ask for signed copy from the next day */
var DN_SIGN_OVERDUE=3;  /* overdue after N days unsigned */
var DN_INV_OVERDUE=3;   /* overdue after N days signed-but-not-invoiced */
var DN_RECENT_SIGN=45;  /* when NO month filter: only chase recent (keeps old history quiet) */
var DN_RECENT_INV=75;
function dnStage(d){ if(d.invoiced)return 'invoiced'; if(d.signed)return 'signed'; return 'open'; }
function dnStatusChip(d){
  if(d.invoiced)return '<span class="chip" style="background:var(--doneBg);color:var(--done);">Invoiced'+(d.invoiceNo?' #'+esc(d.invoiceNo):'')+'</span>';
  if(d.signed)return '<span class="chip" style="background:var(--blueBg);color:var(--blue);">Signed · to invoice</span>';
  return '<span class="chip" style="background:var(--dueBg);color:var(--accentDk);">Awaiting signature</span>';
}
function dnMonth(ym){return (state.dns||[]).filter(function(d){return (d.date||'').slice(0,7)===ym;});}
function dnMonthList(){var s={};(state.dns||[]).forEach(function(d){var ym=(d.date||'').slice(0,7);if(ym)s[ym]=1;});s[ymNow()]=1;return Object.keys(s).sort().reverse();}
function dnMonthSel(id){var sel=state.dnMonth||'';var opts='<option value="">All months</option>'+dnMonthList().map(function(ym){return '<option value="'+ym+'"'+(sel===ym?' selected':'')+'>'+ymLabel(ym)+'</option>';}).join('');return '<select id="'+id+'" class="fancy">'+opts+'</select>';}
function dnAvatar(name){var parts=(name||'?').trim().split(/\s+/);var ini=(((parts[0]||'')[0]||'')+((parts[1]||'')[0]||'')).toUpperCase()||'?';var pal=['#51627A','#5E7C6B','#7A6B8C','#8C6B51','#6B7A51','#8C5E5E','#4E6A8C','#6B6B8C','#7A5E6B','#4F7A72'];var hash=0;for(var i=0;i<(name||'').length;i++)hash=(hash*31+name.charCodeAt(i))>>>0;var c=pal[hash%pal.length];return '<span style="width:46px;height:46px;border-radius:13px;background:'+c+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15.5px;letter-spacing:.3px;flex-shrink:0;">'+esc(ini)+'</span>';}
function dnScope(){var ym=state.dnMonth||'';return ym?(state.dns||[]).filter(function(d){return (d.date||'').slice(0,7)===ym;}):(state.dns||[]);}
/* attention: within a scope list; when a month is chosen show ALL pending in that month, else apply recency window */
function dnAttention(list,monthMode){var rows=[];var t=today();
  (list||[]).forEach(function(d){ if(!d.date)return; var age=between(d.date,t);
    if(!d.signed){ var ok=monthMode?true:(age>=DN_SIGN_DUE&&age<=DN_RECENT_SIGN); if(monthMode?age>=0:ok){ rows.push({d:d,kind:'sign',st:age>=DN_SIGN_OVERDUE?'overdue':'due',date:d.date,age:age}); } }
    else if(!d.invoiced){ var sa=d.signedDate?between(d.signedDate,t):age; var ok2=monthMode?true:(sa<=DN_RECENT_INV); if(ok2){ rows.push({d:d,kind:'invoice',st:sa>=DN_INV_OVERDUE?'overdue':'due',date:d.signedDate||d.date,age:sa}); } }
  });
  return rows;
}
/* ---------- bulk: mark all PREVIOUS months as invoiced (sent to client), leave current month ---------- */
function bulkInvoicePrev(){
  var cur=ymNow();
  var targets=(state.dns||[]).filter(function(d){var ym=(d.date||'').slice(0,7);return ym&&ym<cur&&!d.invoiced;});
  if(!targets.length){toast('Nothing to update — previous months already invoiced.');return;}
  if(!confirm('Mark all '+targets.length+' delivery note(s) from previous months as SIGNED + INVOICED (sent to client)? This month ('+ymLabel(cur)+') is left unchanged.'))return;
  targets.forEach(function(d){d.signed=true;if(!d.signedDate)d.signedDate=d.date;d.invoiced=true;if(!d.invoicedDate)d.invoicedDate=d.date;});
  pushActivity('Bulk invoiced previous months','',targets.length+' DNs',null,null);render();apiSaveAll();toast(targets.length+' previous-month DNs marked invoiced \u2713');
}

}

      +'<div style="display:flex;gap:10px;margin-top:10px;'+(dr.invoiced?'':'opacity:.5;')+'"><div style="flex:1;"><label class="field-label">Invoice number</label><input id="ds_invno" value="'+esc(dr.invoiceNo)+'" placeholder="INV-…"/></div><div style="width:150px;"><label class="field-label">Invoice date</label><input type="date" id="ds_invdate" value="'+esc(dr.invoicedDate)+'"/></div></div>'

function dnProofAttach(files){if(!files||!files.length)return;readDnStatusDraft();var dr=state.dnStatusDraft;var pend=files.length;Array.prototype.forEach.call(files,function(f){compressImage(f,function(url){dr.proofs.push(url);if(--pend===0)renderDnStatus();});});}
function dnProofDel(i){readDnStatusDraft();state.dnStatusDraft.proofs.splice(i,1);renderDnStatus();}
function dnProofView(i){var dr=state.dnStatusDraft;if(dr&&dr.proofs[i])openImg(dr.proofs[i]);}
function saveDnStatus(id){readDnStatusDraft();var dr=state.dnStatusDraft;var d=dnFind(id);if(!d||!dr)return;
  var wasInv=d.invoiced,wasSig=d.signed;
  d.signed=dr.signed;d.signedDate=dr.signed?(dr.signedDate||today()):'';
  d.invoiced=dr.invoiced;d.invoiceNo=dr.invoiced?dr.invoiceNo:'';d.invoicedDate=dr.invoiced?(dr.invoicedDate||today()):'';
  if(d.invoiced&&!d.signed){d.signed=true;d.signedDate=d.signedDate||d.invoicedDate||today();}
  d.proofs=dr.proofs.slice();
  state.dns=state.dns.map(function(x){return x.id===id?d:x;});
  var act=(d.invoiced&&!wasInv)?'DN invoiced':(d.signed&&!wasSig)?'DN signed received':'DN status updated';
  pushActivity(act,d.companyName,'DN #'+d.dnNum+(d.invoiceNo?' · '+d.invoiceNo:''),null,null);
  state.dnStatusDraft=null;closeModal();apiSaveAll();toast('Status saved \u2713');
}

/* ---------- DN dashboard ---------- */
function attBox(title,color,rows,emptyMsg,actKind){
  var hic=actKind==='sign'?'alert':actKind==='invoice'?'doc':'check';
  var html='<div class="card" style="flex:1;min-width:300px;display:flex;flex-direction:column;overflow:hidden;border-top:3px solid '+color+';">'
    +'<div style="padding:14px 16px;display:flex;align-items:center;gap:10px;">'
      +'<span style="width:30px;height:30px;border-radius:9px;background:'+color+'18;color:'+color+';display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+ic(hic,15)+'</span>'
      +'<div style="font-weight:700;font-size:13.5px;color:var(--ink);">'+title+'</div>'
      +'<span style="margin-left:auto;font-size:12px;font-weight:800;color:'+color+';background:'+color+'14;border-radius:20px;padding:3px 11px;min-width:26px;text-align:center;">'+rows.length+'</span>'
    +'</div>';
  if(!rows.length){ html+='<div style="padding:2px 16px 22px;color:var(--muted);font-size:12.5px;line-height:1.5;">'+emptyMsg+'</div>'; }
  else { html+='<div style="border-top:1px solid var(--lineSoft);">'+rows.slice(0,20).map(function(r,i){var d=r.d;var last=(i===Math.min(rows.length,20)-1);var ov=r.st==='overdue';
      var proofBadge=(d.proofs&&d.proofs.length)?' <span style="color:var(--done);vertical-align:middle;" title="Proof attached">'+ic('image',12)+'</span>':'';
      var meta=(d.date?human(d.date):'')+(r.age!=null?' · '+r.age+'d'+(ov?' overdue':''):'')+(actKind==='done'&&d.invoiceNo?' · '+esc(d.invoiceNo):'');
      var action='';
      if(actKind==='sign')action='<button class="dnpill" data-dsigned="'+d.id+'" style="background:'+color+';color:#fff;">Mark signed</button>';
      else if(actKind==='invoice')action='<button class="dnpill" data-dinvoice="'+d.id+'" style="background:'+color+';color:#fff;">Make invoice</button>';
      else action='<button class="icon-btn" data-dnview="'+d.id+'" title="View">'+ic('search',15)+'</button>';
      return '<div class="row" style="display:flex;align-items:center;gap:10px;padding:11px 16px;'+(last?'':'border-bottom:1px solid var(--lineSoft);')+(ov?'box-shadow:inset 3px 0 0 var(--overdue);':'')+'">'
        +'<div style="flex:1;min-width:0;"><div style="font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><b style="color:var(--accentDk);">#'+esc(d.dnNum)+'</b> <span style="color:var(--muted);">·</span> '+esc(d.companyName)+proofBadge+'</div>'
        +'<div style="font-size:11.5px;color:'+(ov?'var(--overdue)':'var(--muted)')+';margin-top:3px;">'+meta+'</div></div>'
        +(can('dnEdit')?'<button class="icon-btn" data-dstatus="'+d.id+'" title="Status / fix" style="color:var(--muted);">'+ic('edit',14)+'</button>':'')+action+'</div>';
    }).join('')+'</div>';
    if(rows.length>20)html+='<div style="padding:9px 16px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--lineSoft);">+'+(rows.length-20)+' more</div>';
  }
  html+='</div>';return html;
}
function viewDnDashboard(){
  var t=today();var ym=state.dnMonth||'';var monthMode=!!ym;
  var scope=dnScope();
  var total=scope.length;
  var awaitingSign=scope.filter(function(d){return !d.signed;}).length;
  var signed=scope.filter(function(d){return d.signed&&!d.invoiced;}).length;
  var invoiced=scope.filter(function(d){return d.invoiced;}).length;
  var att=dnAttention(scope,monthMode);
  var signRows=att.filter(function(r){return r.kind==='sign';}).sort(function(a,b){return b.age-a.age;});
  var invRows=att.filter(function(r){return r.kind==='invoice';}).sort(function(a,b){return b.age-a.age;});
  var invoicedRows=scope.filter(function(d){return d.invoiced;}).sort(function(a,b){return (b.invoicedDate||b.date||'')<(a.invoicedDate||a.date||'')?-1:1;}).map(function(d){return {d:d};});
  function tile(label,val,i,cl,attr){return '<div class="card dtile" '+(attr||'')+' style="'+(attr?'cursor:pointer;':'')+'"><span class="dico" style="background:'+cl+'1A;color:'+cl+';">'+ic(i,17)+'</span><div style="font-size:12px;color:var(--muted);font-weight:600;padding-right:38px;line-height:1.3;">'+label+'</div><div style="font-size:27px;font-weight:800;color:'+cl+';letter-spacing:-.6px;margin-top:8px;">'+val+'</div></div>';}
  var cards='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;">'
    +tile('Total DNs',total,'box','var(--ink)')
    +tile('Awaiting signature',awaitingSign,'alert','var(--accentDk)','data-dnfilt="await"')
    +tile('Signed · to invoice',signed,'doc','var(--blue)','data-dnfilt="toinv"')
    +tile('Invoiced',invoiced,'check','var(--done)','data-dnfilt="invoiced"')+'</div>';
  var bar='<div class="filterbar" style="margin-bottom:18px;"><div class="fld"><label>Month</label>'+dnMonthSel('dn_month')+'</div></div>';
  var boxes='<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;">'
    +attBox('Missing signed DN','#B8860B',signRows,'No delivery notes waiting for a signed copy'+(monthMode?' this month.':'.'),'sign')
    +attBox('Signed · to invoice','#2C6FB3',invRows,'Nothing waiting to be invoiced'+(monthMode?' this month.':'.'),'invoice')
    +attBox('Invoiced','#2E7D52',invoicedRows,'No invoiced delivery notes'+(monthMode?' this month.':' yet.'),'done')
    +'</div>';
  var head='<div style="font-weight:700;font-size:18px;letter-spacing:-.3px;margin:2px 0 4px;">Delivery Notes — Dashboard</div><div style="font-size:12.5px;color:var(--muted);margin-bottom:14px;">Issue → signed copy → invoice.'+(monthMode?' Showing '+ymLabel(ym)+'.':' Previous months can be cleared with one click.')+'</div>';
  return head+bar+cards+boxes;
}

/* ---------- DN report ---------- */
function viewDnReport(){
  var ym=state.dnMonth||'';var scope=dnScope();
  var byStatus={'Awaiting signature':0,'Signed · to invoice':0,'Invoiced':0};
  var byMonth={},byCompany={};
  scope.forEach(function(d){var s=d.invoiced?'Invoiced':d.signed?'Signed · to invoice':'Awaiting signature';byStatus[s]++;var c=d.companyName||'—';byCompany[c]=(byCompany[c]||0)+1;});
  (state.dns||[]).forEach(function(d){var mo=(d.date||'').slice(0,7);if(mo)byMonth[mo]=(byMonth[mo]||0)+1;});
  function tile(l,v,c){return '<div class="card" style="padding:15px 16px;"><div style="font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">'+l+'</div><div style="font-size:22px;font-weight:800;color:'+(c||'var(--ink)')+';letter-spacing:-.5px;">'+v+'</div></div>';}

  function bars(title,obj,fmt){var keys=Object.keys(obj);var vals=keys.map(function(k){return obj[k];});var max=Math.max(1,Math.max.apply(null,vals.length?vals:[1]));var rows=keys.sort(function(a,b){return obj[b]-obj[a];}).slice(0,14).map(function(k,i){var c=colr(i);return '<div style="display:grid;grid-template-columns:1fr 60px;gap:12px;align-items:center;margin-bottom:12px;"><div style="min-width:0;"><div style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span style="width:9px;height:9px;border-radius:3px;background:'+c+';flex-shrink:0;"></span>'+esc(fmt?fmt(k):k)+'</div><div style="height:7px;background:var(--lineSoft);border-radius:6px;overflow:hidden;"><i style="display:block;height:100%;width:'+Math.round(obj[k]/max*100)+'%;background:'+c+';border-radius:6px;"></i></div></div><div style="text-align:right;font-size:12.5px;font-weight:700;">'+obj[k]+'</div></div>';}).join('')||'<div style="color:var(--muted);font-size:13px;">No data.</div>';return '<div class="card" style="padding:18px 18px 8px;flex:1;min-width:280px;"><div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;"><span style="width:5px;height:15px;border-radius:3px;background:var(--accent);display:inline-block;"></span>'+title+'</div>'+rows+'</div>';}
  var charts='<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;">'+bars('By status'+(ym?' ('+ymLabel(ym)+')':''),byStatus)+bars('By month (all)',byMonth,function(k){return ymLabel(k);})+'</div><div style="display:flex;gap:14px;flex-wrap:wrap;">'+bars('Top companies (by DNs)'+(ym?' ('+ymLabel(ym)+')':''),byCompany)+'</div>';
  var bar='<div class="filterbar"><div class="fld"><label>Month</label>'+dnMonthSel('dn_month')+'</div></div>';
  var head='<div style="font-weight:700;font-size:18px;letter-spacing:-.3px;margin:2px 0 2px;">Delivery Notes — Report</div><div style="font-size:12.5px;color:var(--muted);">Status, monthly volume and top companies.</div>';

}

/* ============================================================ STATEMENT OF ACCOUNT (SOA) ============================================================ */
function soaNumber(){var yr=new Date().getFullYear();var mx=0;(state.soas||[]).forEach(function(s){var m=/SOA-(\d{4})-(\d+)/.exec(s.number||'');if(m&&+m[1]===yr){var n=+m[2];if(n>mx)mx=n;}});return 'SOA-'+yr+'-'+String(mx+1).padStart(4,'0');}
function soaFind(id){return (state.soas||[]).find(function(x){return x.id===id;});}
function soaCols(s){return Object.assign({date:true,material:true,invoice:true,dn:true},(s&&s.cols)||{});}
function newSoa(){return {id:uid(),number:soaNumber(),date:today(),from:today().slice(0,4)+'-01-01',to:today(),client:{company:'',attention:'',address:'',vat:''},opening:0,rows:[{date:today(),material:'',invoice:'',dn:'',debit:'',credit:''}],cols:{date:false,material:true,invoice:true,dn:true},notes:'',stamp:false,createdTs:Date.now(),by:(state.me||OWNER||'Team')};}
function soaAmt(v){return parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''))||0;}
function soaRunning(s){var bal=soaAmt(s.opening);return (s.rows||[]).map(function(r){bal+=soaAmt(r.debit)-soaAmt(r.credit);return bal;});}
function soaTotals(s){var td=0,tc=0;(s.rows||[]).forEach(function(r){td+=soaAmt(r.debit);tc+=soaAmt(r.credit);});var closing=soaAmt(s.opening)+td-tc;return {debit:td,credit:tc,closing:closing};}

function openSoa(id){ if(!can('soaEdit')){toast('You do not have permission to create or edit statements.');return;} state.modalOpen=true;
  if(id){state.editingSoa=JSON.parse(JSON.stringify(soaFind(id)));}else{state.editingSoa=newSoa();}
  if(!state.editingSoa.rows||!state.editingSoa.rows.length)state.editingSoa.rows=[{date:today(),ref:'',debit:'',credit:''}];
  renderSoa();
}
function readSoaForm(){var s=state.editingSoa;if(!s)return;var g=function(id){var e=document.getElementById(id);return e?e.value:'';};
  s.number=g('soa_number')||s.number;s.date=g('soa_date')||s.date;s.from=g('soa_from');s.to=g('soa_to');
  s.client.company=g('soa_company');s.client.attention=g('soa_attn');s.client.address=g('soa_addr');s.client.vat=g('soa_vat');
  s.opening=soaAmt(g('soa_opening'));s.notes=g('soa_notes');
  var st=document.getElementById('soa_stamp');s.stamp=st?st.checked:!!s.stamp;
  var rows=[];Array.prototype.forEach.call(document.querySelectorAll('[data-sr]'),function(row,i){var ex=(s.rows&&s.rows[i])||{};var o=Object.assign({},ex);['date','material','invoice','dn','debit','credit'].forEach(function(k){var e=row.querySelector('[data-srf="'+k+'"]');if(e)o[k]=e.value;});rows.push(o);});
  if(rows.length)s.rows=rows;
  s.cols=s.cols||{};['date','material','invoice','dn'].forEach(function(k){var e=document.getElementById('soacol_'+k);if(e)s.cols[k]=e.checked;});
}
function soaAddRow(){readSoaForm();var last=state.editingSoa.rows[state.editingSoa.rows.length-1];state.editingSoa.rows.push({date:(last&&last.date)||today(),material:'',invoice:'',dn:'',debit:'',credit:''});renderSoa();}
function soaDelRow(i){readSoaForm();state.editingSoa.rows.splice(i,1);if(!state.editingSoa.rows.length)state.editingSoa.rows.push({date:today(),material:'',invoice:'',dn:'',debit:'',credit:''});renderSoa();}
function soaPickClient(cid){readSoaForm();var c=state.clients.find(function(x){return x.id===cid;});if(c){var s=state.editingSoa;s.client.company=c.company||'';s.client.attention=c.contact?('Mr. '+c.contact):s.client.attention;s.client.address=c.location||s.client.address;}renderSoa();}
function soaAddFromDNs(){
  readSoaForm();var s=state.editingSoa;var comp=(s.client.company||'').trim().toLowerCase();

  if(!list.length){toast(comp?'No delivery notes for this company.':'Enter the company first.');return;}
  state.modalOpen=true;
  var rows=list.map(function(d){var desc=(d.items||[]).map(function(it){return it.qty+' '+(it.unit||'')+' '+it.desc;}).join('; ');return '<label class="ms-opt" style="align-items:flex-start;"><input type="checkbox" data-sdn="'+d.id+'" style="margin-top:3px;"/> <span><b>DN #'+esc(d.dnNum)+'</b> · '+(d.date?human(d.date):'')+(d.po?' · PO '+esc(d.po):'')+(d.invoiceNo?' · Inv '+esc(d.invoiceNo):'')+'<div style="font-size:11px;color:var(--muted);">'+esc(desc.slice(0,90))+'</div></span></label>';}).join('');
  document.getElementById('overlay').innerHTML='<div class="overlay" data-close="1"><div class="modal" data-stop="1" style="max-width:560px;"><div class="mh"><span class="mt">Add delivery notes to statement</span><button class="icon-btn" data-close="1">'+ic('x',17)+'</button></div><div style="padding:18px 22px;max-height:60vh;overflow:auto;"><div style="font-size:12.5px;color:var(--ink2);margin-bottom:10px;">Tick the delivery notes to add as rows. Each becomes a line (date + "Delivery Note #…" + its invoice no.); enter the Debit amount after.</div>'+rows+'</div><div style="padding:14px 22px;border-top:1px solid var(--lineSoft);display:flex;justify-content:flex-end;gap:10px;"><button class="btn btn-ghost" data-close="1">Cancel</button><button class="btn btn-primary" data-soaadddns="1">Add selected</button></div></div></div>';
  enhanceAll(document.getElementById('overlay'));
}
function soaDoAddDNs(){
  var ids=[];Array.prototype.forEach.call(document.querySelectorAll('[data-sdn]'),function(cb){if(cb.checked)ids.push(cb.getAttribute('data-sdn'));});
  var s=state.editingSoa;ids.forEach(function(id){var d=dnFind(id);if(!d)return;var mat=(d.items||[]).map(function(it){return (it.qty||'')+' '+(it.unit||'')+' '+(it.desc||'');}).join('; ');s.rows.push({date:d.date||today(),material:mat,invoice:(d.invoiceNo||''),dn:'#'+d.dnNum+(d.po?' (PO '+d.po+')':''),debit:'',credit:'',dnId:id});});

  var rowsHtml=(s.rows||[]).map(function(r,i){var cells=_opt.map(function(c){if(c[0]==='date')return '<input type="date" data-srf="date" value="'+esc(r.date||'')+'"/>';return '<input data-srf="'+c[0]+'" value="'+esc(r[c[0]]||(c[0]==='invoice'?(r.ref||''):''))+'" placeholder="'+esc(c[1])+'"/>';}).join('');

    +'<div style="padding-top:9px;font-size:12px;color:var(--muted);font-weight:700;">'+String(i+1).padStart(2,'0')+'</div>'+cells

  var acPanel='<div class="ac-panel" id="soaCompanyAC"></div>';

    +'<div></div>'

function bindSoaCompanyAC(){
  var inp=document.getElementById('soa_company');var panel=document.getElementById('soaCompanyAC');if(!inp||!panel)return;
  var profs={};state.clients.slice().reverse().forEach(function(c){if(c.company)profs[c.company.toLowerCase()]={id:c.id,company:c.company,location:c.location,phone:c.phone};});
  (state.dnCompanies||[]).forEach(function(c){var k=(c.name||'').toLowerCase();if(k&&!profs[k])profs[k]={id:'',company:c.name,location:c.city,phone:c.phone};});
  function show(){var qv=inp.value.trim().toLowerCase();var list=Object.keys(profs).map(function(k){return profs[k];}).filter(function(c){return qv&&c.company.toLowerCase().indexOf(qv)>=0;}).slice(0,6);
    if(!list.length){panel.classList.remove('open');return;}
    panel.innerHTML=list.map(function(c){var sub=[c.location,c.phone].filter(Boolean).join(' · ');return '<div class="ac-opt" data-soacpick="'+esc(c.company)+'"><b>'+esc(c.company)+'</b>'+(sub?'<div style="font-size:11px;color:var(--muted);margin-top:2px;">'+esc(sub)+'</div>':'')+'</div>';}).join('');panel.classList.add('open');}
  inp.addEventListener('input',show);inp.addEventListener('focus',show);
  panel.addEventListener('click',function(e){var o=e.target.closest('[data-soacpick]');if(o){panel.classList.remove('open');readSoaForm();var nm=o.getAttribute('data-soacpick');state.editingSoa.client.company=nm;var cc=state.clients.find(function(x){return (x.company||'')===nm;});if(cc){state.editingSoa.client.attention=cc.contact?('Mr. '+cc.contact):state.editingSoa.client.attention;state.editingSoa.client.address=cc.location||state.editingSoa.client.address;}renderSoa();}});
}
function saveSoa(mode){readSoaForm();var s=state.editingSoa;if(!s)return;if(!s.client.company||!s.client.company.trim()){alert('Please enter the client company.');return;}s.updatedTs=Date.now();s.by=state.me||OWNER||'Team';var ex=soaFind(s.id);if(ex)state.soas=state.soas.map(function(x){return x.id===s.id?s:x;});else state.soas=(state.soas||[]).concat([s]);pushActivity(ex?'Edited statement':'Created statement',s.client.company,s.number,null,null);state.editingSoa=null;closeModal();apiSaveAll();toast('Statement saved \u2713');if(mode==='pdf')downloadSoaPDF(s.id);}
function delSoa(id){var s=soaFind(id);if(!confirm('Delete statement '+(s?s.number:'')+'?'))return;pushActivity('Deleted statement',(s&&s.client&&s.client.company)||'',(s?s.number:''),null,null);state.soas=state.soas.filter(function(x){return x.id!==id;});state.editingSoa=null;if(state.modalOpen)closeModal();else render();apiSaveAll();}

  return head+bar+'<div class="tablewrap card" style="overflow-x:auto;"><table style="min-width:680px;width:100%;"><thead><tr style="background:#F8F9FB;"><th style="padding-left:12px;">Statement</th><th>Client</th><th>Date</th><th>Rows</th><th>Balance due</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function reportHTML(){
  var list=filteredClients();var A=analytics(list);
  var INK='#242A38',MUT='#7A828F',HAIR='#E7E9EE',GOLD='#B8860B';
  function bars(counts){
    var keys=Object.keys(counts).filter(function(k){return counts[k]>0;}).sort(function(x,y){return counts[y]-counts[x];});
    var tot=keys.reduce(function(s,k){return s+counts[k];},0);
    var max=Math.max(1,Math.max.apply(null,keys.map(function(k){return counts[k];})||[1]));

  var opt=function(id,lab,on){return '<label style="display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);padding:6px 0;"><input type="checkbox" id="'+id+'" '+(on?'checked':'')+' style="width:16px;height:16px;"/> '+lab+'</label>';};
  var body='<div style="padding:18px 22px;">'
    +'<div style="font-size:12.5px;color:var(--ink2);margin-bottom:12px;">Choose what to include in the CSV. It respects your current filters (month, product, location, status).</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 22px;">'
    +opt('ex_basic','Lead details (name, dates, channel, location, products, status)',true)
    +opt('ex_quote','Quotation date & value',true)
    +opt('ex_won','Won value & confirmation date',true)
    +opt('ex_followups','Follow-up steps (due / status / remarks)',true)
    +opt('ex_channel','Follow-up channels used',true)
    +opt('ex_extras','Stop info, lost reason & notes',true)
    +opt('ex_contact','Contact person, phone & email',false)
    +opt('ex_next','Next follow-up date & status',false)
    +opt('ex_count','Follow-ups done / total count',false)
    +'</div></div>';
  document.getElementById('overlay').innerHTML='<div class="overlay" data-close="1"><div class="modal" data-stop="1" style="max-width:560px;"><div class="mh"><span class="mt">Export to CSV</span><button class="icon-btn" data-close="1">'+ic('x',17)+'</button></div>'+body+'<div style="padding:14px 22px;border-top:1px solid var(--lineSoft);display:flex;justify-content:flex-end;gap:10px;"><button class="btn btn-ghost" data-close="1">Cancel</button><button class="btn btn-primary" data-doexport="1">'+ic('download',15)+' Download CSV</button></div></div></div>';
  enhanceAll(document.getElementById('overlay'));
}
function doExportCSV(){
  var ck=function(id){var e=document.getElementById(id);return !!(e&&e.checked);};
  var o={basic:ck('ex_basic'),quote:ck('ex_quote'),won:ck('ex_won'),followups:ck('ex_followups'),channel:ck('ex_channel'),extras:ck('ex_extras'),contact:ck('ex_contact'),next:ck('ex_next'),count:ck('ex_count')};
  var head=[];
  if(o.basic)head.push('Lead Name','Lead Received Date & Time','Initial Response Date & Time','Channel (WhatsApp / Email)','Location','Products','Status');
  if(o.contact)head.push('Contact Person','Phone','Email');
  if(o.quote)head.push('Quotation Sharing Date & Time','Quotation Value');
  if(o.won)head.push('Won Value','Order Confirmation Date');
  if(o.next)head.push('Next Follow-up Date','Next Follow-up Status');
  if(o.count)head.push('Follow-ups Done','Follow-ups Total');
  if(o.followups)SCHEDULE.forEach(function(s){head.push(s.f+' Due Date',s.f+' Status',s.f+' Remarks');if(o.channel)head.push(s.f+' Channel');});
  if(o.extras)head.push('Follow-up stopped','Stop reason','Resume on','Lost reason','Notes');
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';};
  var lines=[head.map(q).join(',')];
  filteredClients().forEach(function(c){
    var statusTxt=c.status==='Won'?'Won':c.status==='Lost'?('Lost — '+(c.lostReason||'')):isStopped(c)?'Stopped':(c.quoteShared==='Yes'?'Quotation submitted':(c.responded==='Yes'?'Responded':'Not responded'));
    var row=[];
    if(o.basic)row.push(c.company,dtCsv(c.inquiryDate,c.inquiryTime),c.responded==='Yes'?dtCsv(c.responseDate,c.responseTime):'',c.source||'',c.location||'',(c.products||[]).join('; '),statusTxt);
    if(o.contact)row.push(c.contact||'',c.phone||'',c.email||'');
    if(o.quote)row.push(c.quoteShared==='Yes'?(quoteSubmitDT(c.id)||'Submitted'):'',c.quoteValue||'');
    if(o.won)row.push(c.status==='Won'?(c.wonValue||''):'',c.status==='Won'?(c.wonDate||''):'');
    if(o.next){var nd='',ns='';if(c.quoteShared==='Yes'&&c.status==='Active'){for(var si=0;si<SCHEDULE.length;si++){var rr=(c.followups&&c.followups[SCHEDULE[si].k])||{};if(!rr.done){nd=dueDate(c,SCHEDULE[si]);var dpass=between(today(),nd);ns=dpass<0?'Overdue':dpass===0?'Due today':'Upcoming';break;}}}row.push(nd,ns);}
    if(o.count){var dn=0;SCHEDULE.forEach(function(s){var rr=(c.followups&&c.followups[s.k])||{};if(rr.done)dn++;});row.push(dn,SCHEDULE.length);}
    if(o.followups)SCHEDULE.forEach(function(s){var r=(c.followups&&c.followups[s.k])||{};
      if(c.quoteShared==='Yes'&&c.status!=='Won'){var dd=dueDate(c,s);var passed=between(today(),dd)<=0;var stat=r.done?'Done':(passed?'Not done':'');row.push(dd,stat,r.remark||'');}
      else if(c.quoteShared==='Yes'&&c.status==='Won'){row.push(dueDate(c,s),'',r.remark||'');}
      else{row.push('','',r.remark||'');}
      if(o.channel)row.push(r.channel||'');
    });
    if(o.extras)row.push(c.stopFollowup?'Yes':'No',c.stopReason||'',c.stopResumeDate||'',c.lostReason||'',c.notes||'');
    lines.push(row.map(q).join(','));
  });
  var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ksa-pallets-'+today()+'.csv';a.click();
  closeModal();toast('CSV downloaded');
}

function applyQuick(q){
  if(q==='clear'){state.filters={from:'',to:'',product:'All',location:'All',month:''};render();return;}
  var to=today();var from;
  if(q==='30')from=addDays(to,-30);

  else if(q==='ytd')from=iso(new Date(new Date().getFullYear(),0,1));
  state.filters.from=from;state.filters.to=to;render();
}

function viewQuotes(){
  var qv=state.qSearch.trim().toLowerCase();var lf=state.qListF||{from:'',to:'',product:'All'};state.qListF=lf;
  var all=state.quotes||[];
  var list=all.filter(function(q){
    if(qv&&((q.number+' '+(q.client&&q.client.company||'')).toLowerCase().indexOf(qv)<0))return false;
    if(lf.from&&(q.date||'')<lf.from)return false;
    if(lf.to&&(q.date||'')>lf.to)return false;
    if(lf.product!=='All'&&!(q.items||[]).some(function(it){return it.product===lf.product;}))return false;
    return true;
  }).slice().sort(function(a,b){return (b.createdTs||0)-(a.createdTs||0);});
  var mo=today().slice(0,7),totAll=0,totMo=0,nMo=0,open=0;
  all.forEach(function(q){var g=qGrand(q);totAll+=g;if((q.date||'').slice(0,7)===mo){totMo+=g;nMo++;}if(q.validUntil&&q.validUntil>=today())open++;});
  var kpi='<div class="kpis">'+kpiCard('doc','Quotations',all.length,nMo+' this month')
    +kpiCard('wallet','Total quoted',money(totAll).replace('SAR ','SAR&nbsp;'),'all time','gold')
    +kpiCard('trend','This month',money(totMo).replace('SAR ','SAR&nbsp;'),nMo+' quotation'+(nMo===1?'':'s'))
    +kpiCard('clock','Still valid',open,'not yet expired','green')+'</div>';
  var head='<div class="pghead"><div><h1>Quotations</h1><p>Create, revise and download quotations as PDF</p></div>'+(can('quotesEdit')?'<button class="btn btn-accent2" data-qnew="1">'+ic('plus',15)+' New quotation</button>':'')+'</div>';
  var pOpts=['All'].concat(PRODUCTS).map(function(p){return '<option '+(lf.product===p?'selected':'')+'>'+esc(p)+'</option>';}).join('');
  var bar='<div class="filterbar"><div class="fld"><label>From date</label><input type="date" id="ql_from" value="'+esc(lf.from)+'"/></div>'
    +'<div class="fld"><label>To date</label><input type="date" id="ql_to" value="'+esc(lf.to)+'"/></div>'
    +'<div class="fld"><label>Product</label><select id="ql_product" class="fancy">'+pOpts+'</select></div>'
    +'<div class="fld" style="flex:1 1 200px;"><label>Search</label><div style="position:relative;"><span style="position:absolute;left:11px;top:11px;color:var(--muted);">'+ic('search',15)+'</span><input id="qsearch" value="'+esc(state.qSearch)+'" placeholder="Quote no. or company…" style="padding-left:32px;"/></div></div>'
    +'<div class="fld"><label>&nbsp;</label><div class="quick"><button data-qlq="30">30d</button><button data-qlq="90">90d</button><button data-qlq="ytd">YTD</button><button data-qlq="all">All</button></div></div></div>';
  if(!all.length)return head+emptyState('doc','No quotations yet','Create your first quotation in four quick steps — pick a customer, add products, set terms, then download the PDF.',can('quotesEdit')?'<button class="btn btn-accent2" data-qnew="1">'+ic('plus',15)+' Create first quotation</button>':'');
  if(!list.length)return head+kpi+bar+emptyState('search','No quotations match','Try clearing the filters or searching a different name.','');
  var rows=list.map(function(q){
    var c=(q.client&&q.client.company)||'—';var dl=q.validUntil?daysTo(q.validUntil):null;
    var pill=dl===null?'':(dl<0?'<span class="pill red">Expired</span>':(dl<=3?'<span class="pill amber">'+(dl===0?'Expires today':dl+' day'+(dl===1?'':'s')+' left')+'</span>':'<span class="pill green">Valid · '+dl+' days</span>'));
    return '<tr class="row"><td class="nowrap"><b class="qno">'+esc(q.number)+'</b>'+(q.rev?' <span class="tag" style="background:var(--accentBg);color:var(--accentDk);">Rev '+q.rev+'</span>':'')+'</td>'
    +'<td><div class="who"><span class="av">'+esc(initials(c))+'</span><div><b>'+esc(c)+'</b>'+(q.client&&q.client.attention?'<div class="sub">'+esc(q.client.attention)+'</div>':'')+'</div></div></td>'
    +'<td class="nowrap">'+hfull(q.date)+'</td><td>'+pill+'</td>'
    +'<td class="c">'+(q.items||[]).length+'</td>'
    +'<td class="r nowrap"><b>'+money(qGrand(q))+'</b></td>'
    +'<td class="r nowrap"><button class="icon-btn" data-qview="'+q.id+'" title="View">'+ic('search',15)+'</button><button class="icon-btn" data-qpdf="'+q.id+'" title="Download PDF">'+ic('download',15)+'</button><button class="icon-btn" data-qedit="'+q.id+'" title="Edit">'+ic('edit',15)+'</button><button class="icon-btn" data-qrev="'+q.id+'" title="Create revision">'+ic('refresh',15)+'</button><button class="icon-btn" data-qdel="'+q.id+'" title="Delete">'+ic('trash',15)+'</button></td></tr>';}).join('');
  return head+kpi+bar+'<div class="tablewrap card" style="overflow:auto;"><table class="tbl"><thead><tr><th>Quote no.</th><th>Customer</th><th>Issued</th><th>Validity</th><th class="c">Items</th><th class="r">Total</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
