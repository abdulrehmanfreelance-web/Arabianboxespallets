<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arabian Pallets &amp; Boxes — Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
  :root{
    --bg:#F7F8FA; --panel:#fff; --ink:#1B1E28; --ink2:#3B4250; --muted:#7A828F;
    --line:#E9EBEF; --lineSoft:#F1F2F5; --accent:#191A1D; --accentDk:#07463A; --accentBg:#E3F1EC;
    --slate:#191A1D; --overdue:#C0392B; --overdueBg:#FBECEA; --due:#B07A10; --dueBg:#FAF3E1;
    --done:#2E7D52; --doneBg:#E7F2EC; --upcoming:#9AA7B4; --blue:#2C6FB3; --blueBg:#E8F1FA;
    --purple:#6B5AA8; --purpleBg:#EEEAF6;
    --card-sh:0 1px 2px rgba(26,32,44,.04),0 6px 22px rgba(26,32,44,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;color:var(--ink);font-family:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:#F7F8FA;background-image:radial-gradient(1200px 500px at 80% -10%,#EFF2F7 0%,rgba(239,242,247,0) 60%),linear-gradient(180deg,#FAFBFD 0%,#F5F6F9 100%);background-attachment:fixed;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 70px;}
  .btn{border:none;cursor:pointer;border-radius:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s;font-family:inherit;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#fff;padding:10px 15px;}
  .btn-primary:hover{background:var(--accentDk);}
  .btn-ghost{background:#fff;color:var(--ink2);border:1px solid var(--line);padding:10px 15px;}
  .btn-ghost:hover{border-color:var(--ink2);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
  .icon-btn{background:transparent;border:none;cursor:pointer;color:var(--muted);padding:7px;border-radius:7px;display:inline-flex;transition:.15s;}
  .icon-btn:hover{background:var(--lineSoft);color:var(--ink);}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;outline:none;width:100%;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--card-sh);}
  .chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block;white-space:nowrap;}
  .tag{padding:3px 9px;border-radius:7px;font-size:11px;font-weight:600;background:var(--lineSoft);color:var(--ink2);display:inline-block;}
  .row:hover{background:#FAFBFC;}
  .dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;cursor:pointer;transition:.12s;border:1.5px solid transparent;position:relative;z-index:1;}
  .dot:hover{transform:scale(1.16);}
  .rail{position:relative;display:flex;justify-content:space-between;align-items:center;min-width:290px;}
  .rail-line{position:absolute;top:50%;left:11px;right:11px;height:2px;background:var(--line);z-index:0;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .pulse{animation:pulse 1.8s ease-in-out infinite;}
  @keyframes flash{0%{background:var(--accentBg)}100%{background:transparent}}
  .flash{animation:flash 1s ease-out;}
  .overlay{position:fixed;inset:0;background:rgba(20,28,36,.5);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:60;overflow:auto;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 24px 70px rgba(0,0,0,.28);overflow:hidden;}
  .field-label{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;display:block;}
  table{width:100%;border-collapse:collapse;min-width:860px;}
  th{padding:12px 12px;font-weight:700;font-size:11px;color:var(--muted);text-align:left;text-transform:uppercase;letter-spacing:.4px;}
  .tablewrap{overflow-x:auto;}
  a.qlink{color:var(--muted);}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .seg button{border:none;background:#fff;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2);font-family:inherit;}
  .seg button.on{background:var(--accent);color:#fff;}
  .ms{position:relative;}
  .ms-trigger{min-height:42px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:#fff;cursor:pointer;display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .ms-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.14);z-index:5;padding:6px;display:none;}
  .ms-panel.open{display:block;}
  .ms-opt{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;}
  .ms-opt:hover{background:var(--lineSoft);}
  .ms-opt input{width:auto;}
  .tabbar{display:flex;gap:2px;}
  .tabbar button{border:none;background:transparent;padding:14px 4px;margin-right:22px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;border-bottom:2.5px solid transparent;transition:.15s;display:inline-flex;align-items:center;gap:7px;}
  .tabbar button.on{color:var(--ink);border-bottom-color:var(--accent);}
  .tabbar button:hover{color:var(--ink);}
  .bar{height:8px;border-radius:6px;background:var(--lineSoft);overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:6px;}
  .hide-sm{display:inline-flex;}
  .navcard{cursor:pointer;}
  .navcard:hover{border-color:var(--accent);box-shadow:0 5px 18px rgba(180,116,30,.16);transform:translateY(-1px);}
  .pop{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 18px 50px rgba(20,28,40,.24);padding:0 0 6px;min-width:238px;max-width:308px;max-height:300px;overflow:auto;display:none;}
  .pop.show{display:block;}
  .pop h5{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:#fff;font-weight:700;background:linear-gradient(120deg,#252736,#333a58);padding:11px 13px;border-radius:12px 12px 0 0;position:sticky;top:0;}
  .pop-item{display:flex;align-items:center;gap:8px;padding:8px 11px;margin:0 5px;border-radius:8px;font-size:12.5px;transition:.12s;}
  .pop-item:hover{background:var(--accentBg);}
  .pop-item + .pop-item{border-top:1px solid var(--lineSoft);}
  .pop-foot{font-size:10.5px;color:var(--accentDk);font-weight:600;padding:8px 13px 4px;margin-top:4px;border-top:1px solid var(--lineSoft);}
  .mh{background:linear-gradient(120deg,#252736 0%,#333a58 100%);color:#fff;padding:17px 22px;display:flex;justify-content:space-between;align-items:center;border-top:0;}
  .mh .mt{font-weight:700;font-size:16px;letter-spacing:.2px;}
  .mh .ms{font-size:12px;color:#C4CAD8;margin-top:3px;font-weight:400;}
  .mh .icon-btn{color:#C4CAD8;}
  .mh .icon-btn:hover{background:rgba(255,255,255,.14);color:#fff;}
  .filterbar{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px;padding:15px 18px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--card-sh);position:relative;z-index:30;}
  .filterbar .fld{display:flex;flex-direction:column;gap:6px;}
  .filterbar label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding-left:2px;}
  .filterbar input,.filterbar select{padding:9px 12px;font-size:13px;width:auto;min-width:140px;border-radius:10px;background:#FBFCFD;border:1px solid var(--line);transition:.15s;}
  .filterbar input:hover,.filterbar select:hover{border-color:#D4D8DE;}
  .filterbar input:focus,.filterbar select:focus{background:#fff;}
  .filterbar .quick{display:flex;gap:6px;}
  .filterbar .quick button{border:1px solid var(--line);background:#FBFCFD;border-radius:22px;padding:9px 14px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit;transition:.15s;}
  .filterbar .quick button:hover{border-color:var(--accent);color:var(--accent);background:#fff;}
  .filterbar .fon{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--accentDk);font-weight:600;background:var(--accentBg);padding:6px 12px;border-radius:20px;}
  .statuschips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
  .statuschips button{border:1px solid var(--line);background:#fff;border-radius:22px;padding:7px 15px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit;transition:.15s;}
  .statuschips button:hover{border-color:#D4D8DE;}
  .statuschips button.on{background:var(--slate);color:#fff;border-color:var(--slate);box-shadow:0 3px 10px rgba(37,39,54,.18);}
  .detail-row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--lineSoft);font-size:13.5px;}
  .detail-row .k{width:120px;flex-shrink:0;color:var(--muted);font-weight:600;font-size:12.5px;}
  .detail-row .v{flex:1;color:var(--ink);}
  @media(max-width:640px){.hide-sm{display:none;}.tabbar button{margin-right:16px;}}
  /* custom dropdowns */
  select.fancy{display:none;}
  .dd{position:relative;min-width:150px;}
  .dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FBFCFD;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:14px;color:var(--ink);font-family:inherit;cursor:pointer;text-align:left;transition:.15s;line-height:1.2;}
  .dd-btn:hover{border-color:var(--accent);background:#FEFCF6;}
  .dd-btn.open,.dd-btn:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg);outline:none;background:#fff;}
  .dd-btn .dd-lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
  .dd-btn svg{color:var(--accent);flex-shrink:0;transition:transform .2s;}
  .dd-btn.open svg{transform:rotate(180deg);}
  .dd-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 18px 46px rgba(20,28,40,.22);padding:6px;z-index:70;display:none;max-height:280px;overflow:auto;min-width:180px;}
  .dd-panel.open{display:block;}
  .dd-opt{padding:9px 12px;border-radius:9px;font-size:13.5px;cursor:pointer;color:var(--ink2);white-space:nowrap;transition:.1s;}
  .dd-opt:hover{background:var(--accentBg);color:var(--accentDk);}
  .dd-opt.on{background:var(--accentBg);color:var(--accentDk);font-weight:600;}
  /* nicer native date fields */
  input[type=date],input[type=time]{background:#FBFCFD;border-radius:11px;padding:10px 13px;}
  input[type=date]:hover,input[type=time]:hover{border-color:#CFD4DB;}
  input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.55;padding:2px;border-radius:5px;}
  input[type=date]::-webkit-calendar-picker-indicator:hover,input[type=time]::-webkit-calendar-picker-indicator:hover{opacity:1;background:var(--accentBg);}
  .filterbar .dd{min-width:150px;}
  .filterbar .dd-btn{padding:9px 12px;font-size:13px;}
  /* follow-up attachments */
  .attrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;}
  .attbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accentDk);background:var(--accentBg);border:1px dashed var(--accent);border-radius:9px;padding:7px 11px;cursor:pointer;transition:.15s;}
  .attbtn:hover{background:#F3E7C7;}
  .thumb{position:relative;width:54px;height:54px;border-radius:9px;overflow:hidden;border:1px solid var(--line);cursor:pointer;box-shadow:var(--card-sh);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .del{position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;border:none;background:rgba(15,18,26,.7);color:#fff;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .thumb .del:hover{background:var(--overdue);}
  .lightbox{position:fixed;inset:0;background:rgba(15,18,26,.86);display:flex;align-items:center;justify-content:center;z-index:95;padding:26px;cursor:zoom-out;}
  .lightbox img{max-width:94%;max-height:94%;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.6);}
  /* custom date picker */
  .dp{position:relative;display:block;}
  input.dp-native{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .dp-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FBFCFD;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:14px;color:var(--ink);font-family:inherit;cursor:pointer;text-align:left;transition:.15s;line-height:1.2;}
  .dp-btn:hover{border-color:#CFD4DB;}
  .dp-btn.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg);}
  .dp-btn .dp-lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dp-btn .dp-lab.ph{color:var(--muted);}
  .dp-btn svg{color:var(--accent);flex-shrink:0;}
  .dp-panel{position:fixed;z-index:98;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 54px rgba(20,28,40,.24);padding:13px;width:266px;}
  .dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
  .dp-title{font-weight:700;font-size:13.5px;color:var(--ink);}
  .dp-nav{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);padding:0;}
  .dp-nav:hover{border-color:var(--accent);color:var(--accent);background:var(--accentBg);}
  .dp-nav.prev svg{transform:rotate(90deg);}
  .dp-nav.next svg{transform:rotate(-90deg);}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .dp-dow{font-size:9.5px;font-weight:700;color:var(--muted);text-align:center;padding:3px 0 5px;text-transform:uppercase;letter-spacing:.3px;}
  .dp-day{border:none;background:transparent;border-radius:9px;height:32px;font-size:13px;color:var(--ink2);cursor:pointer;font-family:inherit;transition:.1s;}
  .dp-day:hover{background:var(--accentBg);color:var(--accentDk);}
  .dp-day.sel{background:var(--accent);color:#fff;font-weight:700;}
  .dp-day.today{box-shadow:inset 0 0 0 1.6px var(--accent);}
  .dp-day.fri{color:#C0392B;}
  .dp-day.fri:hover{background:var(--overdueBg);}
  .dp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--lineSoft);}
  .dp-foot button{border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--accentDk);padding:4px 6px;border-radius:6px;}
  .dp-foot button:hover{background:var(--accentBg);}
  /* clear count vs percent */
  .pctpill{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:700;color:var(--accentDk);background:var(--accentBg);padding:3px 8px;border-radius:20px;vertical-align:middle;min-width:40px;text-align:center;}
  .valnum{font-size:15px;font-weight:800;color:var(--ink);vertical-align:middle;}
  /* custom time picker (manual + dropdown) */
  .tp{position:relative;display:block;}
  .tp .tp-native{padding-right:40px;}
  .tp-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--accent);cursor:pointer;padding:7px;border-radius:8px;display:flex;}
  .tp-btn:hover{background:var(--accentBg);}
  .tp-panel{position:absolute;top:calc(100% + 5px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 38px rgba(20,28,40,.2);padding:6px;z-index:45;display:none;max-height:224px;overflow:auto;}
  .tp-panel.open{display:block;}
  .tp-opt{display:flex;justify-content:space-between;gap:10px;padding:8px 11px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink2);}
  .tp-opt:hover{background:var(--accentBg);color:var(--accentDk);}
  /* activity kebab menu */
  .kebab{margin-left:auto;flex-shrink:0;}
  .actmenu{position:absolute;top:46px;right:14px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 14px 36px rgba(20,28,40,.2);padding:5px;z-index:25;display:none;min-width:160px;}
  .actmenu.open{display:block;}
  .actmenu button{display:flex;align-items:center;gap:9px;width:100%;border:none;background:transparent;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit;text-align:left;}
  .actmenu button:hover{background:var(--accentBg);color:var(--accentDk);}
  @keyframes flashcard{0%{box-shadow:0 0 0 3px var(--accent);}100%{box-shadow:var(--card-sh);}}
  .flashcard{animation:flashcard 1.4s ease-out;}
  /* form sections + roomier layout */
  .formsec{grid-column:1/-1;font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--accentDk);margin:8px 0 -2px;padding-top:14px;border-top:1px solid var(--lineSoft);display:flex;align-items:center;gap:8px;}
  .formsec.first{border-top:none;padding-top:2px;}
  .formsec .sq{width:6px;height:6px;border-radius:2px;background:var(--accent);display:inline-block;}
  /* company autocomplete */
  .ac{position:relative;}
  .ac-panel{position:absolute;top:calc(100% + 5px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 38px rgba(20,28,40,.2);padding:6px;z-index:55;display:none;max-height:236px;overflow:auto;}
  .ac-panel.open{display:block;}
  .ac-opt{padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;color:var(--ink);}
  .ac-opt:hover{background:var(--accentBg);}
  .ac-opt b{color:var(--accentDk);}
  /* settings */
  .setcard{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card-sh);padding:20px 22px;margin-bottom:16px;}
  .setcard h3{font-size:14px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:9px;}
  .setcard h3 .sq{width:6px;height:16px;border-radius:3px;background:var(--accent);display:inline-block;}
  .setcard .desc{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
  .chiplist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .editchip{display:inline-flex;align-items:center;gap:8px;background:var(--accentBg);color:var(--accentDk);border:1px solid #EAD9B0;border-radius:20px;padding:7px 8px 7px 13px;font-size:13px;font-weight:600;}
  .editchip button{border:none;background:rgba(0,0,0,.12);color:#fff;width:18px;height:18px;border-radius:50%;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .editchip button:hover{background:var(--overdue);}
  .addrow{display:flex;gap:8px;}
  .addrow input{flex:1;}
  .schrow{display:grid;grid-template-columns:1fr 110px 40px;gap:10px;align-items:center;margin-bottom:9px;}
  .schrow input{padding:8px 11px;font-size:13px;}
  .dangerbtn{border:1px solid var(--overdueBg);background:#fff;color:var(--overdue);border-radius:9px;padding:10px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .dangerbtn:hover{background:var(--overdueBg);}
  .areabtn{border:none;background:transparent;color:#C6D0DB;font-family:inherit;font-size:13px;font-weight:700;padding:7px 15px;border-radius:8px;cursor:pointer;transition:.15s;}
  .areabtn:hover{color:#fff;}
  .areabtn.on{background:var(--accent);color:#fff;}
  .qrow{display:grid;grid-template-columns:26px 1.4fr 1.8fr 60px 56px 90px 96px 30px;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid var(--lineSoft);}
  .qrow input,.qrow textarea{padding:8px 9px;font-size:12.5px;}
  .qrow .amt{font-size:12.5px;font-weight:700;text-align:right;padding-top:9px;color:var(--ink);}
  .qhead{display:grid;grid-template-columns:26px 1.4fr 1.8fr 60px 56px 90px 96px 30px;gap:8px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding-bottom:6px;}
  @media(max-width:720px){.qrow,.qhead{grid-template-columns:1fr 1fr;}.qhead{display:none;}}
  .stwrap .chip{white-space:normal;line-height:1.45;display:inline-block;text-align:left;}
  tr.wonrow,tr.wonrow:hover{background:var(--doneBg)!important;}

/* sidebar */
#areaswitch{gap:2px!important;}
#areaswitch .areabtn{padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:600;}
#areaswitch .areabtn svg{width:17px;height:17px;}
#areaswitch .areabtn.on{background:rgba(217,154,80,.16);box-shadow:inset 3px 0 0 var(--accent2);}
.navlabel{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#6B6F78;font-weight:800;padding:16px 14px 6px;}
#btnAdd{border-radius:12px!important;padding:12px 14px!important;font-size:13.5px;}
#apbbar>.wrap>div:last-child>div:nth-child(2){display:flex!important;align-items:center;gap:8px;padding:6px 8px 6px 8px!important;border-radius:14px!important;}
#me{font-size:12.5px!important;}
.meav{width:30px;height:30px;border-radius:50%;background:var(--accent2);color:#191A1D;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none;}
#usersico{display:none!important;}
/* tab bar */
#tabwrap{background:rgba(255,255,255,.92)!important;}
.tabbar{padding:10px 0!important;}
.tabbar button{border-radius:999px!important;padding:8px 16px!important;font-size:13px!important;}
.tabbar button.on{background:#191A1D!important;color:#fff!important;box-shadow:none!important;}
.tabbar button.on svg{color:var(--accent2)!important;}
/* page head, KPI cards */
.pghead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:2px 0 18px;flex-wrap:wrap;}
.pghead h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px;}
.pghead p{margin:3px 0 0;color:var(--muted);font-size:13.5px;}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px;}
.kpi{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--card-sh);}
.kpi-i{width:44px;height:44px;border-radius:13px;background:#F1EFEA;color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none;}
.kpi.gold .kpi-i{background:var(--accentBg);color:var(--accentDk);}.kpi.green .kpi-i{background:var(--doneBg);color:var(--done);}
.kpi-l{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px;}
.kpi-v{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-top:2px;white-space:nowrap;}
.kpi-s{font-size:11.5px;color:var(--muted);margin-top:1px;}
/* tables */
table.tbl{width:100%;border-collapse:separate;border-spacing:0;}
table.tbl th{background:#FAF8F4;color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);}
table.tbl td{padding:15px 16px;border-top:1px solid var(--lineSoft);font-size:13.5px;vertical-align:middle;}
table.tbl tr:first-child td{border-top:none;}
table.tbl tbody tr:hover td{background:#FCFAF6;}
table.tbl .r{text-align:right;}table.tbl .c{text-align:center;}.nowrap{white-space:nowrap;}
.qno{color:var(--accentDk);font-weight:800;}
.who{display:flex;align-items:center;gap:11px;}.who b{font-weight:700;}.who .sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
.av{width:36px;height:36px;border-radius:11px;background:var(--accentBg);color:var(--accentDk);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;}
.pill:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill.green{background:var(--doneBg);color:var(--done);}.pill.amber{background:var(--dueBg);color:var(--due);}.pill.red{background:var(--overdueBg);color:var(--overdue);}
/* empty state */
.empty{padding:56px 24px!important;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;}
.eico{width:68px;height:68px;border-radius:22px;background:var(--accentBg);color:var(--accentDk);display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
.etitle{font-weight:800;font-size:18px;}.etext{color:var(--muted);font-size:13.5px;max-width:440px;line-height:1.55;}.empty .btn{margin-top:12px;}
.btn-accent2{background:var(--accent2)!important;color:#191A1D!important;box-shadow:0 6px 16px rgba(217,154,80,.32);}
.btn{padding:10px 16px;}
.field-label{font-size:12px;font-weight:700;margin-bottom:6px;display:block;}
/* ===== quotation wizard ===== */
.qwz{border-radius:22px!important;}
.qwz .mh{padding:16px 24px;}
.qstepof{margin-left:auto;margin-right:14px;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent2);}
.qwz .enq-body{min-height:560px;}
.qwz .enq-rail{width:230px;padding:22px 14px;}
.qwz .enq-main{padding:28px 34px;max-height:68vh;}
.qwz input:not([type=checkbox]):not([type=radio]),.qwz textarea,.qwz select{padding:11px 13px;font-size:14px;width:100%;}
.qwz textarea{min-height:46px;resize:vertical;}
.qh h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px;}
.qh p{margin:5px 0 18px;color:var(--muted);font-size:13px;line-height:1.5;}
.qh2{margin-top:30px;padding-top:22px;border-top:1px solid var(--lineSoft);}.qh2 h3{font-size:15px;margin-bottom:12px;}.qh2 h3+p{margin-top:-6px;}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}.qgrid.q3{grid-template-columns:repeat(3,minmax(0,1fr));}.qfull{grid-column:1/-1;}
.qrecent{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.qrecent>span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-right:4px;}
.qchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit;display:inline-flex;gap:6px;align-items:center;transition:.12s;}
.qchip:hover{border-color:var(--accent2);background:var(--accentBg);color:var(--accentDk);}
.qchip-add svg{color:var(--accent2);}
.qopt{font-weight:500;color:var(--muted);font-size:11px;margin-left:4px;}
.qok{font-size:11.5px;color:var(--done);margin-top:6px;display:flex;gap:5px;align-items:center;font-weight:600;}
.qlist{margin-top:14px;}
.qli{display:flex;gap:14px;background:#FBFAF7;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
.qli:focus-within{border-color:var(--accent2);background:#fff;box-shadow:0 0 0 3px rgba(217,154,80,.14);}
.qli-n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:26px;}
.qli-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;}
.qli-r1{display:grid;grid-template-columns:minmax(0,2.5fr) 84px 100px minmax(0,1.1fr) minmax(0,1.1fr);gap:12px;align-items:end;}
.f-amt .amt{height:44px;display:flex;align-items:center;justify-content:flex-end;font-weight:800;font-size:15px;color:var(--accentDk);}
.qli-act{display:flex;flex-direction:column;gap:4px;}
.qtot{margin:20px 0 0 auto;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 20px;box-shadow:var(--card-sh);}
.qt-r{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;color:var(--ink2);}
.qt-g{border-top:1px solid var(--line);margin-top:7px;padding-top:12px;font-size:17px;font-weight:800;color:var(--ink);}.qt-g b{color:var(--accentDk);}
.qprice{background:#FBFAF7;border:1px solid var(--line);border-radius:16px;padding:6px 20px 20px;}
.qprice-r{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--lineSoft);}
.qprice-v{display:flex;gap:8px;align-items:center;font-weight:700;}.qprice-v input{width:130px!important;text-align:right;padding:9px 11px!important;}
.qmut{color:var(--muted);font-size:12.5px;}
.qsw{display:flex!important;align-items:center;gap:12px;cursor:pointer;font-weight:700;}
.qsw input[type=checkbox]{appearance:none;-webkit-appearance:none;width:44px!important;height:25px;border-radius:99px;background:#D6D3CB;position:relative;cursor:pointer;transition:.15s;border:none;margin:0!important;flex:none;}
.qsw input[type=checkbox]:after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:.15s;}
.qsw input[type=checkbox]:checked{background:var(--accent2);}.qsw input[type=checkbox]:checked:after{left:22px;}
.qterms{display:flex;flex-direction:column;gap:2px;}
.qterm{display:flex!important;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:13px;color:var(--ink2);cursor:pointer;line-height:1.5;}
.qterm:hover{background:#FBFAF7;}
.qsum{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:16px;color:#fff;}
.qsum-k{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent2);font-weight:800;}
.qsum-n{font-size:12.5px;font-weight:800;margin:3px 0 12px;word-break:break-all;}
.qsum-r{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;color:rgba(255,255,255,.62);}
.qsum-r b{color:#fff;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:112px;}
.qsum-t{margin-top:10px;background:rgba(217,154,80,.16);border-radius:12px;padding:11px 13px;}
.qsum-t span{display:block;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--accent2);font-weight:800;}.qsum-t b{font-size:15px;color:#fff;}
.qtips{display:flex;gap:10px;background:#FBF1DF;border:1px solid #EBD3B1;color:#7A5518;border-radius:14px;padding:13px 15px;font-size:13px;margin-bottom:18px;line-height:1.5;}
.qtips.ok{background:var(--doneBg);border-color:#BFDCCB;color:var(--done);}.qtips svg{flex:none;margin-top:2px;}
.qrev{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.qrev-c{border:1px solid var(--line);border-radius:16px;padding:16px 18px;}
.qrev-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--accentDk);margin-bottom:8px;}
.qlink{background:none;border:none;color:var(--accentDk);font-weight:700;cursor:pointer;font-family:inherit;font-size:12px;text-transform:none;letter-spacing:0;}.qlink:hover{text-decoration:underline;}
.qkv{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:13px;border-bottom:1px dotted var(--line);}.qkv:last-child{border-bottom:none;}.qkv span{color:var(--muted);}.qkv b{text-align:right;font-weight:700;}.qkv i{color:var(--muted);}
.qrev-t{border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.qrev-t table{width:100%;border-collapse:collapse;table-layout:fixed;}
.qrev-t th,.qrev-t td{padding:11px 14px;font-size:13px;border-top:1px solid var(--lineSoft);text-align:left;vertical-align:top;}
.qrev-t thead th{background:#FAF8F4;font-size:10.5px;text-transform:uppercase;color:var(--muted);border-top:none;letter-spacing:.6px;}
.qrev-t .qr{text-align:right;white-space:nowrap;}.qrev-t .qc{text-align:center;width:44px;}.qrev-t .qmut{font-size:11.5px;margin-top:2px;}
.qwz .enq-foot{padding:16px 26px;}
@media(max-width:1100px){.qwz .enq-rail{width:auto}.qsum{display:none}.qli-r1{grid-template-columns:1fr 1fr}.qgrid,.qgrid.q3,.qrev{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.qwz .enq-main{padding:20px;max-height:none}}
/* ===================== v3 — simple, light, timeless ===================== */
:root{--bg:#FAF9F7;--panel:#fff;--ink:#17181B;--ink2:#43464D;--muted:#7B7F88;--line:#E7E4DD;--lineSoft:#F1EEE8;
  --accent:#17181B;--accent2:#D99A50;--accentDk:#94601F;--accentBg:#F8EFE1;--card-sh:none;}
html,body{font-family:Inter,'Segoe UI',system-ui,-apple-system,Arial,sans-serif!important;background:var(--bg)!important;color:var(--ink);}
body{padding-left:252px!important;font-size:14px;line-height:1.5;}
.wrap{max-width:1280px;}
#view{padding-bottom:48px;}
#syncrow{font-size:11.5px!important;margin-bottom:6px!important;opacity:.7;}

/* ---------- sidebar: light ---------- */
#apbbar{width:252px!important;background:#fff!important;color:var(--ink)!important;border-right:1px solid var(--line)!important;}
#apbbar>.wrap{padding:20px 14px 16px!important;gap:14px!important;}
#apbbar>.wrap>div:first-child{border-bottom:1px solid var(--line)!important;padding-bottom:16px!important;}
#apbbar #brandlogo{background:transparent!important;border-radius:0!important;padding:0!important;max-height:64px!important;width:auto!important;max-width:100%;}
#apbbar .brandtitle #brandname{color:var(--ink)!important;font-size:15px!important;font-weight:700!important;}
#apbbar .brandtitle small{color:var(--accentDk)!important;letter-spacing:1.8px;font-size:10px!important;}
#modebadge{color:var(--muted)!important;}
#areaswitch{margin:0!important;gap:1px!important;}
#areaswitch .areabtn{color:var(--ink2)!important;border-radius:8px!important;padding:9px 12px!important;font-size:13.5px!important;font-weight:500!important;gap:10px!important;}
#areaswitch .areabtn svg{color:#9A9DA5!important;}
#areaswitch .areabtn:hover{background:#F6F4EF!important;color:var(--ink)!important;}
#areaswitch .areabtn.on{background:#F4F1EA!important;color:var(--ink)!important;font-weight:700!important;box-shadow:inset 3px 0 0 var(--accent2)!important;}
#areaswitch .areabtn.on svg{color:var(--accentDk)!important;}
.navlabel{color:#A3A6AE!important;font-size:10px!important;letter-spacing:1.6px;padding:14px 12px 5px!important;}
#btnAdd{background:var(--accent)!important;color:#fff!important;box-shadow:none!important;border-radius:8px!important;padding:11px 14px!important;font-weight:600!important;}
#btnAdd:hover{background:#2c2e34!important;filter:none!important;}
#apbbar>.wrap>div:last-child>div:nth-child(2){background:#F6F4EF!important;border:1px solid var(--line)!important;border-radius:10px!important;}
#me{color:var(--ink)!important;}#me::placeholder{color:#9A9DA5;}
#btnExport,#btnLogout{background:#fff!important;color:var(--ink2)!important;border:1px solid var(--line)!important;font-weight:500!important;border-radius:8px!important;}
#btnExport:hover,#btnLogout:hover{background:#F6F4EF!important;}
.meav{background:var(--accent)!important;color:#fff!important;}

/* ---------- tabs: simple underline ---------- */
#tabwrap{background:#fff!important;backdrop-filter:none!important;border-bottom:1px solid var(--line)!important;}
.tabbar{gap:0!important;padding:0!important;}
.tabbar button{background:none!important;border:none!important;border-bottom:2px solid transparent!important;border-radius:0!important;padding:15px 4px!important;margin:0 24px 0 0!important;color:var(--muted)!important;font-size:13.5px!important;font-weight:600!important;box-shadow:none!important;}
.tabbar button:hover{color:var(--ink)!important;background:none!important;}
.tabbar button.on{color:var(--ink)!important;border-bottom-color:var(--accent2)!important;background:none!important;box-shadow:none!important;}
.tabbar button.on svg{color:var(--accentDk)!important;}

/* ---------- surfaces ---------- */
.card,.setcard,.filterbar,.kpi,.qprice,.qrev-c,.qtot,.tablewrap{border-radius:10px!important;box-shadow:none!important;border:1px solid var(--line)!important;background:#fff;}
.card:hover{box-shadow:none!important;}
.navcard:hover{border-color:#cfc9bd!important;box-shadow:none!important;}
.dtile{border-left:1px solid var(--line)!important;border-radius:10px!important;}
.btn{border-radius:8px!important;font-weight:600!important;box-shadow:none!important;padding:9px 15px;}
.btn-primary{background:var(--accent)!important;color:#fff!important;}
.btn-primary:hover{background:#2c2e34!important;}
.btn-ghost{background:#fff!important;border:1px solid var(--line)!important;color:var(--ink2)!important;}
.btn-ghost:hover{border-color:#cfc9bd!important;color:var(--ink)!important;background:#FBFAF7!important;}
.btn-accent2{background:var(--accent2)!important;color:#17181B!important;box-shadow:none!important;}
.btn-accent2:hover{filter:brightness(1.05);}
input,select,textarea{border-radius:8px!important;border:1px solid #DAD6CD;}
input:focus,select:focus,textarea:focus{border-color:var(--accent2)!important;box-shadow:0 0 0 3px rgba(217,154,80,.18)!important;}
.field-label{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px;display:block;}
.chip,.tag{border-radius:6px!important;}
.chip{font-weight:600;}
.icon-btn{border-radius:8px;}
.icon-btn:hover{background:#F4F1EA!important;color:var(--ink)!important;}
th{letter-spacing:.5px;}
thead tr{background:#FAF8F4!important;}
tr.row:hover,.row:hover{background:#FBFAF7!important;}
.statuschips button{border-radius:8px!important;}
.statuschips button.on,.quick button.on,.ctile.on{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;box-shadow:none!important;}
.filterbar .quick button{border-radius:8px!important;}
.bar i{background:var(--accent2);}

/* ---------- modals: plain header ---------- */
.overlay{background:rgba(23,24,27,.45)!important;}
.modal{border-radius:14px!important;box-shadow:0 24px 70px rgba(0,0,0,.22)!important;}
.mh{background:#fff!important;color:var(--ink)!important;border-bottom:1px solid var(--line)!important;padding:16px 24px!important;}
.mh .mt{color:var(--ink)!important;font-size:17px!important;font-weight:700!important;}
.mh .icon-btn{color:var(--ink2)!important;}
.qstepof{margin-left:auto;margin-right:12px;font-size:12px;font-weight:700;color:var(--accentDk)!important;background:var(--accentBg);padding:4px 10px;border-radius:6px;letter-spacing:.3px;text-transform:none!important;}
.enq-foot{background:#fff!important;border-top:1px solid var(--line)!important;padding:14px 24px!important;display:flex;align-items:center;gap:10px;}
.qone{padding:6px 28px 10px!important;max-height:74vh!important;overflow:auto;}
.sech{font-size:11.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--accentDk);margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--lineSoft);}
.sech.first{margin-top:18px;}
.sech .qopt{text-transform:none;letter-spacing:0;font-weight:500;}
.qwz input:not([type=checkbox]):not([type=radio]),.qwz textarea,.qwz select{padding:10px 12px;font-size:14px;width:100%;}
.qli{border-radius:10px!important;background:#FCFBF9;}
.qli:focus-within{box-shadow:none!important;border-color:var(--accent2)!important;background:#fff;}
.qli-n{background:var(--ink)!important;}
.qchip{border-radius:8px!important;}
.qbar-t{display:flex;align-items:baseline;gap:10px;margin-right:8px;}
.qbar-t span{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;}
.qbar-t b{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.3px;}
.qdet{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff;}
.qdet summary{padding:13px 16px;font-weight:600;font-size:13.5px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;}
.qdet summary::-webkit-details-marker{display:none;}
.qdet summary:before{content:'›';font-size:18px;line-height:1;color:var(--muted);transition:transform .15s;display:inline-block;width:12px;}
.qdet[open] summary:before{transform:rotate(90deg);}
.qdet-b{padding:2px 16px 16px;}
.qprice{background:#fff;}
.qtot{box-shadow:none!important;}
.pill{border-radius:6px!important;}
.av{border-radius:50%!important;}
.kpis{gap:12px;}
.kpi{padding:15px 18px;}.kpi-i{background:#F4F1EA!important;color:var(--ink2)!important;border-radius:50%;}
.kpi.gold .kpi-i,.kpi.green .kpi-i{background:#F4F1EA!important;color:var(--ink2)!important;}
.kpi-v{font-size:20px;}
.pghead h1{font-size:24px;font-weight:700;letter-spacing:-.4px;}
.btn-accent2{box-shadow:none!important;}
.empty{border-style:dashed!important;background:transparent!important;}
.eico{background:#F4F1EA!important;border-radius:50%!important;}
table.tbl th{background:#FAF8F4;}

/* ---------- Home: calm ---------- */
.homehero{background:#17181B!important;border-radius:12px!important;}
.homehero:after{display:none!important;}
.hometile{border-radius:12px!important;box-shadow:none!important;border:1px solid var(--line)!important;}
.hometile:hover{border-color:#cfc9bd!important;box-shadow:none!important;transform:none!important;}
.hometile [style*="gradient"]{background:#F4F1EA!important;color:var(--ink)!important;box-shadow:none!important;}
.hometile [style*="gradient"] svg{color:var(--accentDk)!important;stroke:var(--accentDk)!important;}
.hometile [style*="color:#"]{}

/* ---------- CRM overview ---------- */
.dstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px;}
.dk{padding:18px 20px;border-right:1px solid var(--lineSoft);border-bottom:1px solid var(--lineSoft);cursor:pointer;transition:background .12s;}
.dk:nth-child(4n){border-right:none;}.dk:nth-last-child(-n+4){border-bottom:none;}
.dk:hover{background:#FBFAF7;}
.dk-l{display:block;font-size:12px;color:var(--muted);font-weight:600;}
.dk b{display:block;font-size:30px;font-weight:700;letter-spacing:-.8px;margin-top:6px;line-height:1.1;}
.dk.warn b{color:var(--due);}.dk.bad b{color:var(--overdue);}.dk.good b{color:var(--done);}
.dgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start;margin-bottom:18px;}
.dgrid>div>.card{margin:0 0 16px!important;}
.dpipe{padding:18px 20px;}
.dh{font-size:11.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.dp{display:grid;grid-template-columns:104px 1fr 34px;gap:12px;align-items:center;font-size:13px;margin-bottom:11px;}
.dp:last-child{margin-bottom:0;}
.dp b{text-align:right;font-weight:700;}
.dbar{height:8px;background:var(--lineSoft);border-radius:99px;overflow:hidden;}
.dbar i{display:block;height:100%;background:var(--accent2);border-radius:99px;}
@media(max-width:1100px){.dgrid{grid-template-columns:1fr}.dstrip{grid-template-columns:repeat(2,minmax(0,1fr))}.dk:nth-child(4n){border-right:1px solid var(--lineSoft)}.dk:nth-child(2n){border-right:none}.dk:nth-last-child(-n+4){border-bottom:1px solid var(--lineSoft)}.dk:nth-last-child(-n+2){border-bottom:none}}
@media(max-width:900px){body{padding-left:0!important;}#apbbar{width:auto!important;}}

.qwz .dp,.qwz .dd{width:100%;}.qwz .dp-btn,.qwz .dd-btn{width:100%;justify-content:space-between;}
.enq-pane{gap:14px 18px!important;}
.dp-btn{min-width:150px;}.enq .dp,.enq .dd,.enq .dp-btn,.enq .dd-btn{width:100%;}.filterbar .fld{min-width:0;}

/* ---------- date utils ---------- */
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d);}
function today(){return iso(new Date());}
function between(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function human(s){return pd(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});}
function humanDay(s){return pd(s).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});}
function humanFull(s){return s?pd(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* KSA weekend = Friday. Fri and Sat are NOT counted as days: the schedule counts working days only (Sat–Thu). */
function shiftWorkday(s){var d=pd(s);if(d.getDay()===5)d.setDate(d.getDate()+1);return iso(d);}
function addWorkdays(s,n){var d=pd(s);var added=0;while(added<n){d.setDate(d.getDate()+1);if(d.getDay()!==5)added++;}return iso(d);}
function followBase(c){return c.quoteDate||c.inquiryDate;}
function dueDate(c,step){var r=c.followups&&c.followups[step.k];if(r&&r.date)return r.date;return addWorkdays(followBase(c),step.o);}

/* ---------- custom dropdowns (replace ugly native selects) ---------- */
function enhanceSelects(root){
  root=root||document;
  Array.prototype.forEach.call(root.querySelectorAll('select.fancy'),function(sel){
    if(sel.parentNode&&sel.parentNode.classList&&sel.parentNode.classList.contains('dd'))return;
    var dd=document.createElement('div');dd.className='dd';
    sel.parentNode.insertBefore(dd,sel);dd.appendChild(sel);
    var btn=document.createElement('button');btn.type='button';btn.className='dd-btn';
    var panel=document.createElement('div');panel.className='dd-panel';
    function lab(){var o=sel.options[sel.selectedIndex];return o?o.text:'';}
    function build(){
      btn.innerHTML='<span class="dd-lab">'+esc(lab())+'</span>'+ic('chevron',15);
      panel.innerHTML='';
      Array.prototype.forEach.call(sel.options,function(o,i){
        var it=document.createElement('div');it.className='dd-opt'+(i===sel.selectedIndex?' on':'');
        it.textContent=o.text;
        it.onclick=function(){sel.selectedIndex=i;build();panel.classList.remove('open');btn.classList.remove('open');sel.dispatchEvent(new Event('change',{bubbles:true}));};
        panel.appendChild(it);
      });
    }
    btn.onclick=function(e){e.stopPropagation();var wasOpen=panel.classList.contains('open');closeAllDD();if(!wasOpen){panel.classList.add('open');btn.classList.add('open');}};
    dd.appendChild(btn);dd.appendChild(panel);build();
  });
}
function closeAllDD(){Array.prototype.forEach.call(document.querySelectorAll('.dd-panel.open'),function(p){p.classList.remove('open');});Array.prototype.forEach.call(document.querySelectorAll('.dd-btn.open'),function(b){b.classList.remove('open');});}

/* ---------- custom date picker (matches the dropdowns) ---------- */
var DPMON=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DPDOW=['Su','Mo','Tu','We','Th','Fr','Sa'];
var dpEl=null,dpBtn=null;
function closeDP(){if(dpEl){dpEl.remove();dpEl=null;}if(dpBtn){dpBtn.classList.remove('open');dpBtn=null;}}
function fmtDP(iso){return iso?pd(iso).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}):'';}
function enhanceDates(root){
  root=root||document;
  Array.prototype.forEach.call(root.querySelectorAll('input[type=date]'),function(inp){
    if(inp.parentNode&&inp.parentNode.classList&&inp.parentNode.classList.contains('dp'))return;
    var wrap=document.createElement('span');wrap.className='dp';
    inp.parentNode.insertBefore(wrap,inp);wrap.appendChild(inp);inp.classList.add('dp-native');
    var btn=document.createElement('button');btn.type='button';btn.className='dp-btn';
    function refresh(){btn.innerHTML='<span class="dp-lab'+(inp.value?'':' ph')+'">'+(inp.value?esc(fmtDP(inp.value)):'Select date')+'</span>'+ic('cal',15);}
    refresh();inp._dp=refresh;
    btn.onclick=function(e){e.stopPropagation();if(dpBtn===btn){closeDP();return;}openDP(inp,btn,refresh);};
    wrap.appendChild(btn);
  });
}
function openDP(inp,btn,refresh){
  closeDP();closeAllDD();dpBtn=btn;btn.classList.add('open');
  var cur=inp.value?pd(inp.value):new Date();var ym={y:cur.getFullYear(),m:cur.getMonth()};
  dpEl=document.createElement('div');dpEl.className='dp-panel';
  function draw(){
    var start=new Date(ym.y,ym.m,1).getDay();var days=new Date(ym.y,ym.m+1,0).getDate();
    var h='<div class="dp-head"><button type="button" class="dp-nav prev" data-dpnav="-1">'+ic('chevron',16)+'</button><span class="dp-title">'+DPMON[ym.m]+' '+ym.y+'</span><button type="button" class="dp-nav next" data-dpnav="1">'+ic('chevron',16)+'</button></div><div class="dp-grid">'+DPDOW.map(function(d){return '<span class="dp-dow">'+d+'</span>';}).join('');
    for(var i=0;i<start;i++)h+='<span></span>';
    for(var d=1;d<=days;d++){var iso=ym.y+'-'+String(ym.m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');var dow=new Date(ym.y,ym.m,d).getDay();h+='<button type="button" class="dp-day'+(inp.value===iso?' sel':'')+(today()===iso?' today':'')+((dow===5||dow===6)?' fri':'')+'" data-dpday="'+iso+'">'+d+'</button>';}
    h+='</div><div class="dp-foot"><button type="button" data-dptoday="1">Today</button><button type="button" data-dpclear="1">Clear</button></div>';
    dpEl.innerHTML=h;
  }
  draw();document.body.appendChild(dpEl);
  var r=btn.getBoundingClientRect(),pw=dpEl.offsetWidth,ph=dpEl.offsetHeight;
  var left=Math.max(8,Math.min(r.left,window.innerWidth-pw-10));
  var top=r.bottom+6;if(top+ph>window.innerHeight-8)top=Math.max(8,r.top-ph-6);
  dpEl.style.left=left+'px';dpEl.style.top=top+'px';
  dpEl.addEventListener('click',function(e){
    e.stopPropagation();
    var nav=e.target.closest('[data-dpnav]');if(nav){ym.m+=(+nav.getAttribute('data-dpnav'));if(ym.m<0){ym.m=11;ym.y--;}else if(ym.m>11){ym.m=0;ym.y++;}draw();return;}
    var day=e.target.closest('[data-dpday]');if(day){inp.value=day.getAttribute('data-dpday');refresh();closeDP();inp.dispatchEvent(new Event('change',{bubbles:true}));return;}
    if(e.target.closest('[data-dptoday]')){inp.value=today();refresh();closeDP();inp.dispatchEvent(new Event('change',{bubbles:true}));return;}
    if(e.target.closest('[data-dpclear]')){inp.value='';refresh();closeDP();inp.dispatchEvent(new Event('change',{bubbles:true}));return;}
  });
}
function enhanceAll(root){enhanceSelects(root);enhanceDates(root);enhanceTimes(root);}

function enhanceTimes(root){
  root=root||document;
  Array.prototype.forEach.call(root.querySelectorAll('input[type=time]'),function(inp){
    if(inp.parentNode&&inp.parentNode.classList&&inp.parentNode.classList.contains('tp'))return;
    inp.type='text';inp.setAttribute('placeholder','e.g. 14:30');inp.setAttribute('maxlength','5');inp.classList.add('tp-native');
    var wrap=document.createElement('span');wrap.className='tp';inp.parentNode.insertBefore(wrap,inp);wrap.appendChild(inp);
    var btn=document.createElement('button');btn.type='button';btn.className='tp-btn';btn.innerHTML=ic('clock',15);

function productTags(c){return (c.products||[]).map(function(p){return '<span class="tag">'+esc(p)+'</span>';}).join(' ')||'<span style="color:var(--muted);font-size:12px;">—</span>';}
function statusChip(c){
  if(c.status==='Won')return '<span class="chip" style="background:var(--doneBg);color:var(--done);">Won · client gained</span>';
  if(c.status==='Lost')return '<span class="chip" style="background:var(--overdueBg);color:var(--overdue);">Lost'+(c.lostReason?' · '+esc(c.lostReason):'')+'</span>';
  if(isStopped(c))return '<span class="chip" style="background:#F1F3F5;color:var(--ink2);">Stopped'+(c.stopResumeDate?' · resume '+human(c.stopResumeDate):'')+(c.stopReason?' · '+esc(c.stopReason):'')+'</span>';
  if(isSubmitted(c))return '<span class="chip" style="background:var(--doneBg);color:var(--done);">Quotation submitted</span>';
  if(hasResponded(c))return '<span class="chip" style="background:var(--blueBg);color:var(--blue);">Responded · awaiting quotation</span>';
  return '<span class="chip" style="background:var(--dueBg);color:var(--accentDk);">Not responded yet</span>';
}
function statusMatch(c,st){
  if(st==='all')return true;
  if(st==='notresponded')return notResponded(c);
  if(st==='responded')return respondedOnly(c);
  if(st==='submitted')return isSubmitted(c);
  if(st==='won')return c.status==='Won';
  if(st==='lost')return c.status==='Lost';
  if(st==='stopped')return isStopped(c);
  return true;
}

function dt(dstr,tstr){ if(!dstr)return '—'; return human(dstr)+(tstr?' · '+tstr:''); }
function companyInquiries(company){return (state.clients||[]).filter(function(c){return (c.company||'').trim().toLowerCase()===(company||'').trim().toLowerCase();}).sort(function(a,b){var x=(a.inquiryDate||'')+(a.inquiryTime||'')+(a.id||'');var y=(b.inquiryDate||'')+(b.inquiryTime||'')+(b.id||'');return x<y?-1:x>y?1:0;});}
function inqNo(c){var list=companyInquiries(c&&c.company);for(var i=0;i<list.length;i++){if(list[i].id===c.id)return i+1;}return 1;}
function inqTag(c){if(!c)return '';var list=companyInquiries(c.company);if(list.length<=1)return '';return ' <span style="font-weight:600;color:var(--accentDk);font-size:.9em;">· Inq #'+inqNo(c)+'</span>';}
function inqTagPlain(c){if(!c)return '';var list=companyInquiries(c.company);if(list.length<=1)return '';return ' · Inq #'+inqNo(c);}
function companyGroups(){
  var g={};(state.clients||[]).forEach(function(c){var k=(c.company||'').trim().toLowerCase();if(!k)return;if(!g[k])g[k]={company:c.company,items:[]};g[k].items.push(c);});
  return g;
}
function companyStats(items){
  var s={total:items.length,won:0,lost:0,active:0,submitted:0,lastDate:''};
  items.forEach(function(c){if(c.status==='Won')s.won++;else if(c.status==='Lost')s.lost++;else s.active++;if(c.quoteShared==='Yes')s.submitted++;if(!s.lastDate||(c.inquiryDate||'')>s.lastDate)s.lastDate=c.inquiryDate||'';});
  return s;
}
function viewCompanies(){
  state.compSearch=state.compSearch||'';
  var g=companyGroups();
  var q=state.compSearch.trim().toLowerCase();
  var rows=Object.keys(g).map(function(k){var grp=g[k];return {company:grp.company,items:grp.items,st:companyStats(grp.items)};})
    .filter(function(r){return !q||r.company.toLowerCase().indexOf(q)>=0;})
    .sort(function(a,b){return b.st.total-a.st.total;});
  var head='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:2px 0 4px;"><div><div style="font-weight:700;font-size:18px;letter-spacing:-.3px;">Companies</div><div style="font-size:12.5px;color:var(--muted);margin-top:2px;">'+rows.length+' companies · every inquiry from the same company grouped together</div></div></div>';
  var bar='<div class="filterbar"><div class="fld" style="flex:1;"><label>Search company</label><input id="comp_search" value="'+esc(state.compSearch)+'" placeholder="Company name…"/></div></div>';
  if(!rows.length)return head+bar+'<div class="card" style="padding:30px;text-align:center;color:var(--muted);font-size:13.5px;">No companies yet.</div>';
  var pgc=pager('comp',rows.length);var pageRows=rows.slice(pgc.start,pgc.end);
  var trows=pageRows.map(function(r){var s=r.st;return '<tr class="row" data-compopen="'+esc(r.company)+'" style="border-top:1px solid var(--lineSoft);cursor:pointer;">'
    +'<td style="padding:11px 12px;font-weight:600;font-size:12.5px;">'+esc(r.company)+'<div style="font-size:11px;color:var(--muted);font-weight:400;">last inquiry '+(s.lastDate?human(s.lastDate):'—')+'</div></td>'
    +'<td style="padding:11px 12px;text-align:center;font-size:13px;font-weight:700;">'+s.total+'</td>'
    +'<td style="padding:11px 12px;text-align:center;"><span class="chip" style="background:var(--doneBg);color:var(--done);">'+s.won+'</span></td>'
    +'<td style="padding:11px 12px;text-align:center;"><span class="chip" style="background:var(--overdueBg);color:var(--overdue);">'+s.lost+'</span></td>'
    +'<td style="padding:11px 12px;text-align:center;"><span class="chip" style="background:var(--dueBg);color:var(--accentDk);">'+s.active+'</span></td>'
    +'<td style="padding:11px 12px;text-align:center;font-size:12px;color:var(--ink2);">'+s.submitted+'</td>'
    +'<td style="padding:11px 12px;text-align:right;"><button class="icon-btn" data-compopen="'+esc(r.company)+'" title="Full history">'+ic('search',15)+'</button></td></tr>';}).join('');
  return head+bar+pgc.ctrl+'<div class="tablewrap card" style="overflow-x:auto;"><table style="min-width:640px;width:100%;"><thead><tr style="background:#F8F9FB;"><th style="padding-left:12px;">Company</th><th style="text-align:center;">Inquiries</th><th style="text-align:center;">Won</th><th style="text-align:center;">Lost</th><th style="text-align:center;">Open</th><th style="text-align:center;">Quotations</th><th></th></tr></thead><tbody>'+trows+'</tbody></table></div><div style="font-size:11.5px;color:var(--muted);margin-top:8px;">Click a company to see its full history.</div>';
}
function openCompany(name){
  state.modalOpen=true;
  var items=(state.clients||[]).filter(function(c){return (c.company||'').trim().toLowerCase()===(name||'').trim().toLowerCase();})
    .sort(function(a,b){return (b.inquiryDate||'')<(a.inquiryDate||'')?-1:1;});
  var s=companyStats(items);
  var tiles='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-bottom:14px;">'
    +'<div class="card" style="padding:10px 12px;text-align:center;"><div style="font-size:19px;font-weight:800;">'+s.total+'</div><div style="font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Inquiries</div></div>'
    +'<div class="card" style="padding:10px 12px;text-align:center;"><div style="font-size:19px;font-weight:800;color:var(--done);">'+s.won+'</div><div style="font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Won</div></div>'
    +'<div class="card" style="padding:10px 12px;text-align:center;"><div style="font-size:19px;font-weight:800;color:var(--overdue);">'+s.lost+'</div><div style="font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Lost</div></div>'
    +'<div class="card" style="padding:10px 12px;text-align:center;"><div style="font-size:19px;font-weight:800;color:var(--accentDk);">'+s.active+'</div><div style="font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Open</div></div>'
    +'<div class="card" style="padding:10px 12px;text-align:center;"><div style="font-size:19px;font-weight:800;">'+s.submitted+'</div><div style="font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Quoted</div></div>'
    +'</div>';
  var rows=items.map(function(c){return '<tr class="row" style="border-top:1px solid var(--lineSoft);"><td style="padding:9px 12px;font-size:11.5px;white-space:nowrap;">'+dt(c.inquiryDate,c.inquiryTime)+'</td>'
    +'<td style="padding:9px 12px;">'+productTags(c)+'</td>'
    +'<td style="padding:9px 12px;font-size:11.5px;color:var(--ink2);">'+esc(c.contact||'')+(c.location?' · '+esc(c.location):'')+'</td>'
    +'<td style="padding:9px 12px;"><span class="stwrap">'+statusChip(c)+'</span></td>'
    +'<td style="padding:9px 12px;text-align:right;"><button class="icon-btn" data-act="detail" data-id="'+c.id+'" title="Open">'+ic('search',14)+'</button></td></tr>';}).join('');
  var body='<div style="padding:18px 20px;max-height:74vh;overflow:auto;">'+tiles
    +'<div style="font-size:10px;letter-spacing:1.4px;color:var(--accent);text-transform:uppercase;font-weight:700;margin:4px 0 8px;">All inquiries from this company</div>'
    +'<div class="tablewrap card" style="overflow-x:auto;"><table style="min-width:560px;width:100%;"><thead><tr style="background:#F8F9FB;"><th style="padding-left:12px;">Date</th><th>Products</th><th>Contact</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  document.getElementById('overlay').innerHTML='<div class="overlay" data-close="1"><div class="modal" data-stop="1" style="max-width:760px;"><div class="mh"><span class="mt">'+esc(name)+' — company history</span><button class="icon-btn" data-close="1">'+ic('x',17)+'</button></div>'+body+'</div></div>';
  enhanceAll(document.getElementById('overlay'));
}
function viewInquiries(){
  var base=filteredClients();
  var q=state.search.trim().toLowerCase();
  var list=base.filter(function(c){
    if(!statusMatch(c,state.inqStatus))return false;
    if(q&&(c.company+' '+c.contact+' '+c.email+' '+c.phone+' '+(c.location||'')+' '+(c.products||[]).join(' ')).toLowerCase().indexOf(q)<0)return false;
    return true;
  });

  function cnt(fn){return base.filter(fn).length;}
  var STAT=[['all','All',base.length],
    ['notresponded','Not responded',cnt(notResponded)],
    ['responded','Responded',cnt(respondedOnly)],
    ['submitted','Submitted',cnt(isSubmitted)],
    ['won','Won',cnt(function(c){return c.status==='Won';})],
    ['lost','Lost',cnt(function(c){return c.status==='Lost';})],
    ['stopped','Stopped',cnt(isStopped)]];
  var stChips='<div class="statuschips">'+STAT.map(function(s){return '<button data-status="'+s[0]+'" class="'+(state.inqStatus===s[0]?'on':'')+'">'+s[1]+' <span style="opacity:.65;font-weight:700;">'+s[2]+'</span></button>';}).join('')+'</div>';

  var head='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;"><div style="position:relative;flex:1 1 240px;max-width:340px;"><span style="position:absolute;left:11px;top:12px;color:var(--muted);">'+ic('search',15)+'</span><input id="search" value="'+esc(state.search)+'" placeholder="Search company, contact, product, location…" style="padding-left:32px;"/></div><div style="margin-left:auto;color:var(--muted);font-size:13px;">'+list.length+' inquiries · click a name for full details</div></div>';
  var pgi=pager('inq',list.length);var pageList=list.slice(pgi.start,pgi.end);
  var rows=pageList.map(function(c){var SI=SRCICO[c.source]||'msg';
    var respLine=prioChip(c)+(c.responded==='Yes'?'<div style="font-size:10.5px;color:var(--done);margin-top:3px;">Responded '+dt(c.responseDate,c.responseTime)+'</div>':'<div style="font-size:10.5px;color:var(--accentDk);margin-top:3px;">Not responded</div>');
    return '<tr class="row'+(c.status==='Won'?' wonrow':'')+'" style="border-top:1px solid var(--lineSoft);"><td style="padding:11px 12px;"><div style="font-weight:600;font-size:12.5px;color:var(--accentDk);cursor:pointer;white-space:nowrap;" data-act="detail" data-id="'+c.id+'">'+esc(c.company)+inqTag(c)+(c.status==='Won'?' <span style="color:var(--done);">'+ic('trophy',12)+'</span>':'')+'</div><div style="font-size:11px;color:var(--muted);">'+esc(c.contact)+'</div></td>'
      +'<td style="padding:11px 12px;"><span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink2);white-space:nowrap;"><span style="color:var(--accent);display:flex;">'+ic(SI,13)+'</span>'+esc(c.source||'—')+'</span></td>'
      +'<td style="padding:11px 12px;font-size:11.5px;color:var(--ink2);white-space:nowrap;">'+(c.location?'<span style="display:inline-flex;align-items:center;gap:4px;"><span style="color:var(--muted);display:flex;">'+ic('pin',12)+'</span>'+esc(c.location)+'</span>':'—')+'</td>'
      +'<td style="padding:11px 12px;max-width:160px;">'+productTags(c)+'</td>'
      +'<td style="padding:11px 12px;font-size:11.5px;color:var(--ink2);white-space:nowrap;"><div>'+dt(c.inquiryDate,c.inquiryTime)+'</div>'+respLine+'</td>'
      +'<td style="padding:11px 12px;">'+(c.quoteShared==='Yes'?(c.quoteValue?'<span style="font-size:11.5px;">'+esc(c.quoteValue)+'</span>':'<span class="tag" style="background:var(--doneBg);color:var(--done);">Submitted</span>'):'<span class="tag" style="background:var(--dueBg);color:var(--accentDk);">Not submitted</span>')+'</td>'
      +'<td style="padding:11px 12px;max-width:180px;"><span class="stwrap">'+statusChip(c)+'</span></td>'
      +'<td style="padding:11px 12px;text-align:right;white-space:nowrap;"><button class="icon-btn" data-act="detail" data-id="'+c.id+'" title="View details">'+ic('search',14)+'</button><button class="icon-btn" data-act="log" data-id="'+c.id+'" title="Follow-up & outcome">'+ic('list',14)+'</button><button class="icon-btn" data-act="edit" data-id="'+c.id+'" title="Edit inquiry">'+ic('edit',14)+'</button><button class="icon-btn" data-act="del" data-id="'+c.id+'" title="Delete">'+ic('trash',14)+'</button></td></tr>';}).join('')
    ||'<tr><td colspan="8" style="padding:36px;text-align:center;color:var(--muted);font-size:13px;">No inquiries match this view.</td></tr>';
  return filterBar()+stChips+head+pgi.ctrl+'<div class="tablewrap card" style="overflow-x:auto;"><table class="inqtable" style="min-width:940px;width:100%;"><thead><tr style="background:#F8F9FB;"><th style="padding-left:12px;">Client</th><th>Inquiry via</th><th>Location</th><th>Products</th><th>Received / Responded</th><th>Quotation</th><th>Status</th><th style="text-align:right;padding-right:12px;">Actions</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+(list.length>(state.pageSize.inq||50)?pgi.ctrl:'');
}

/* ============================================================ FOLLOW-UPS ============================================================ */
function railHTML(c){return '<div class="rail"><div class="rail-line"></div>'+SCHEDULE.map(function(step){var st=fu(c,step);var m=M[st];var done=st==='done';return '<div class="dot '+((st==='overdue'||st==='due')?'pulse':'')+'" data-act="log" data-id="'+c.id+'" title="'+step.f+' · '+humanDay(dueDate(c,step))+' · '+m.l+'" style="background:'+(done?m.c:'#fff')+';border-color:'+m.c+';color:'+(done?'#fff':m.c)+';">'+(done?'✓':step.s)+'</div>';}).join('')+'</div>';}
function fclientCard(c){
  var next='';var na=null;
  SCHEDULE.forEach(function(s){if(na)return;var st=fu(c,s);if(st==='overdue'||st==='due'||st==='upcoming')na={s:s,st:st};});
  if(na){var m=M[na.st];next='<span class="chip" style="background:'+m.bg+';color:'+m.c+';">Next: '+na.s.f+' · '+humanDay(dueDate(c,na.s))+'</span>';}
  return '<div class="card" style="padding:15px 16px;margin-bottom:12px;border-left:3px solid '+(SCHEDULE.some(function(s){return fu(c,s)==='overdue';})?'var(--overdue)':'transparent')+';">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px;"><div><div style="font-weight:700;font-size:14px;cursor:pointer;color:var(--accentDk);" data-act="detail" data-id="'+c.id+'">'+esc(c.company)+inqTag(c)+'</div><div style="font-size:12px;color:var(--muted);margin-top:2px;">'+esc(c.contact)+' · '+esc(c.phone)+(c.location?' · '+esc(c.location):'')+' · inquiry '+human(c.inquiryDate)+'</div><div style="margin-top:7px;">'+productTags(c)+'</div></div><div style="display:flex;gap:8px;align-items:center;">'+next+'<button class="btn btn-primary btn-sm" data-act="log" data-id="'+c.id+'">Log follow-up</button></div></div>'
    +railHTML(c)+'</div>';
}
function viewFollowups(){
  var base=filteredClients();
  var activeAll=base.filter(followActive);
  var awaiting=base.filter(awaitingQ);
  var closed=base.filter(function(c){return c.status!=='Active'||isStopped(c);});
  var ft=state.fuTab||'active';

  var subtabs='<div class="statuschips" style="margin-bottom:16px;">'
    +'<button data-futab="active" class="'+(ft==='active'?'on':'')+'">Active follow-ups <span style="opacity:.7;font-weight:700;">'+activeAll.length+'</span></button>'
    +'<button data-futab="awaiting" class="'+(ft==='awaiting'?'on':'')+'">Awaiting quotation <span style="opacity:.7;font-weight:700;">'+awaiting.length+'</span></button>'
    +'<button data-futab="closed" class="'+(ft==='closed'?'on':'')+'">Closed &amp; stopped <span style="opacity:.7;font-weight:700;">'+closed.length+'</span></button></div>';

  var h=filterBar()+subtabs;

  if(ft==='active'){
    var active=activeAll;
    if(state.fuFilter==='missed')active=active.filter(function(c){return hasState(c,'overdue');});
    else if(state.fuFilter==='due')active=active.filter(function(c){return hasState(c,'due');});
    h+='<div class="statuschips">'+[['all','All active'],['missed','Missed only'],['due','Due today only']]
      .map(function(s){return '<button data-fu="'+s[0]+'" class="'+(state.fuFilter===s[0]?'on':'')+'">'+s[1]+'</button>';}).join('')+'</div>';
    var pgf=pager('fu',active.length);var pageActive=active.slice(pgf.start,pgf.end);
    h+=pgf.ctrl;
    h+=active.length?pageActive.map(fclientCard).join(''):'<div class="card" style="padding:24px;color:var(--muted);font-size:13.5px;">Nothing here. Follow-ups start automatically once a quotation is marked as submitted.</div>';
  } else if(ft==='awaiting'){
    h+=awaiting.length?awaiting.map(function(c){return '<div class="card row" style="padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:13.5px;cursor:pointer;color:var(--accentDk);white-space:nowrap;" data-act="detail" data-id="'+c.id+'">'+esc(c.company)+inqTag(c)+'</div><div style="font-size:12px;color:var(--muted);">'+esc(c.contact)+(c.location?' · '+esc(c.location):'')+' · inquiry '+human(c.inquiryDate)+(c.notSubmittedReason?' · '+esc(c.notSubmittedReason.split("\\n")[0]):'')+'</div></div><span class="chip" style="background:var(--dueBg);color:var(--accentDk);">Not submitted</span><button class="btn btn-ghost btn-sm" data-act="log" data-id="'+c.id+'">Log reason</button><button class="btn btn-ghost btn-sm" data-act="lost" data-id="'+c.id+'" style="color:var(--overdue);border-color:var(--overdue);">Can\'t provide</button><button class="btn btn-primary btn-sm" data-act="share" data-id="'+c.id+'">Mark submitted</button></div>';}).join(''):'<div class="card" style="padding:24px;color:var(--muted);font-size:13.5px;">No inquiries awaiting a quotation.</div>';
  } else {
    h+=closed.length?'<div class="card" style="overflow:hidden;">'+closed.map(function(c,i){return '<div class="row" style="padding:13px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:'+(i?'1px solid var(--lineSoft)':'none')+';"><div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:13.5px;cursor:pointer;color:var(--accentDk);white-space:nowrap;" data-act="detail" data-id="'+c.id+'">'+esc(c.company)+inqTag(c)+'</div><div style="font-size:12px;color:var(--muted);">inquiry '+human(c.inquiryDate)+'</div></div><span class="stwrap">'+statusChip(c)+'</span><button class="btn btn-ghost btn-sm" data-act="log" data-id="'+c.id+'">Open</button></div>';}).join('')+'</div>':'<div class="card" style="padding:24px;color:var(--muted);font-size:13.5px;">Nothing closed or stopped yet.</div>';
  }
  return h;
}

/* ============================================================ ANALYSIS ============================================================ */
function analytics(list){
  var total=list.length;
  var shared=list.filter(function(c){return c.quoteShared==='Yes';}).length;
  var awaiting=list.filter(awaitingQ).length;
  var won=list.filter(function(c){return c.status==='Won';}).length;
  var lost=list.filter(function(c){return c.status==='Lost';}).length;
  var stopped=list.filter(isStopped).length;
  var activeF=list.filter(followActive).length;
  var done=0,missed=0,due=0,upc=0;
  list.forEach(function(c){SCHEDULE.forEach(function(s){var st=fu(c,s);if(st==='done')done++;else if(st==='overdue')missed++;else if(st==='due')due++;else if(st==='upcoming')upc++;});});
  var winrate=won+lost>0?Math.round(won/(won+lost)*100):0;
  var fuChannel={};list.forEach(function(c){if(c.followups)Object.keys(c.followups).forEach(function(k){var r=c.followups[k];if(r&&r.done&&r.channel){fuChannel[r.channel]=(fuChannel[r.channel]||0)+1;}});});
  return {total:total,shared:shared,awaiting:awaiting,won:won,lost:lost,stopped:stopped,activeF:activeF,done:done,missed:missed,due:due,upc:upc,winrate:winrate,
    product:countBy(list,'product'),location:countBy(list,'location'),source:countBy(list,'source'),fuChannel:fuChannel};
}
function pct(n,t){return t?Math.round(n/t*100):0;}
function valTag(n,p){return '<span class="valnum">'+n+'</span><span class="pctpill">'+p+'%</span>';}
function barBlock(title,counts){
  var keys=Object.keys(counts);var tot=keys.reduce(function(s,k){return s+counts[k];},0);
  var max=Math.max(1,Math.max.apply(null,keys.map(function(k){return counts[k];})||[1]));

  });

function money(n){return 'SAR '+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function qAmt(it){return (parseFloat(it.qty)||0)*(parseFloat(it.price)||0);}
function qSub(q){return (q.items||[]).reduce(function(s,it){return s+qAmt(it);},0);}
function qDisc(q){return q.discountOn?(parseFloat(q.discount)||0):0;}
function qVatAmt(q){return q.vatOn?((qSub(q)-qDisc(q))*(parseFloat(q.vatRate)||0)/100):0;}
function qGrand(q){return qSub(q)-qDisc(q)+qVatAmt(q);}
function nextQuoteNo(){var yr=new Date().getFullYear();var max=0;(state.quotes||[]).forEach(function(q){var m=/QT-(\d{4})-(\d+)/.exec(q.number||'');if(m&&+m[1]===yr){var n=+m[2];if(n>max)max=n;}});return 'QT-'+yr+'-'+String(max+1).padStart(6,'0');}

function qAddRow(){readQuoteForm();state.editingQuote.items.push(qEmptyRow());renderQuote();var l=document.querySelectorAll('[data-qi] [data-qf="product"]');if(l.length)try{l[l.length-1].focus();l[l.length-1].scrollIntoView({block:'center'});}catch(e){}}
function qDelRow(i){readQuoteForm();var q=state.editingQuote;q.items.splice(i,1);if(!q.items.length)q.items.push(qEmptyRow());renderQuote();}

function qQuick(p){readQuoteForm();var q=state.editingQuote;var empty=q.items.length===1&&!qHasItem(q.items[0]);var row=qEmptyRow();row.product=p;qFillFromHistory(row);if(empty)q.items=[row];else q.items.push(row);renderQuote();var l=document.querySelectorAll('[data-qi]');if(l.length){var last=l[l.length-1].querySelector('[data-qf="qty"]');try{last.focus();last.select();}catch(e){}}}

function qLastLine(product){var best=null,bt=-1;(state.quotes||[]).forEach(function(x){(x.items||[]).forEach(function(it){if(it.product===product&&(parseFloat(it.price)||0)>0&&(x.createdTs||0)>=bt){bt=x.createdTs||0;best=it;}});});return best;}
function qFillFromHistory(row){var h=qLastLine(row.product);if(!h)return false;if(!(parseFloat(row.price)>0))row.price=h.price;if(!(row.spec||'').trim())row.spec=h.spec||'';if(h.unit)row.unit=h.unit;return true;}
/* customers: from inquiries + earlier quotations */
function qPrevClients(){var seen={},out=[];(state.quotes||[]).slice().sort(function(a,b){return (b.createdTs||0)-(a.createdTs||0);}).forEach(function(x){var c=x.client||{};var k=(c.company||'').trim().toLowerCase();if(k&&!seen[k]){seen[k]=1;out.push(c);}});return out;}

    +'</div><div class="qli-act"><button type="button" class="icon-btn" data-qdup="'+i+'" title="Duplicate line">'+ic('list',15)+'</button><button type="button" class="icon-btn" data-qdelrow="'+i+'" title="Remove line">'+ic('trash',15)+'</button></div></div>';}).join('');

function qStep3(q){

  var presets=(QUOTE_PRESETS&&QUOTE_PRESETS.length)?('<div class="qgrid q3">'+QUOTE_PRESETS.map(function(g){var sel=(q.presetSel&&q.presetSel[g.label])||'';return qF(esc(g.label),'<select class="fancy" data-qpreset="'+esc(g.label)+'"><option value="">— none —</option>'+(g.options||[]).map(function(o){return '<option'+(sel===o?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>');}).join('')+'</div>'):'';

    +'<div class="qtot" id="qtot">'+qTotalsView(q)+'</div></div>'

   +det('more','More options <span class="qopt">stamp, revision label, notes</span>','<div class="qopts"><label class="qterm"><input type="checkbox" id="q_showrev" '+(q.showRev===false?'':'checked')+'/><span>Show revision label (e.g. “Rev '+((q.rev||0)+1)+'”) after the quotation number</span></label>'
   +'</div>'

function renderQuote(){

   +'<button type="button" class="btn btn-ghost" data-qpreview="1">'+ic('search',14)+' Preview</button><button type="button" class="btn btn-ghost" data-qsave="draft">Save</button><button type="button" class="btn btn-accent2" data-qsave="pdf">'+ic('download',15)+' Save &amp; download PDF</button></div>';

    +'<div class="mh"><span class="mt">'+(exists?'Edit':'New')+' quotation'+(q.rev?' · Rev '+q.rev:'')+'</span><span class="qstepof">'+esc(q.number)+'</span><button type="button" class="icon-btn" data-qclose="1">'+ic('x',17)+'</button></div>'
